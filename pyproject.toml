[project]
name = "vinta_schedule_api"
version = "0.1.0"
description = "Django 5, React, Bootstrap 5 with Python 3 and webpack project boilerplate"
authors = [{ name = "Vinta Software", email = "contact@vinta.com.br" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Django>=6.0,<7",
    "celery>=5.5.2,<6",
    "celery-redbeat>=2.3.2,<3",
    "django-model-utils>=5.0.0,<6",
    "django-import-export>=4.3.7,<5",
    "djangorestframework>=3.16.0,<4",
    "python-decouple-typed>=3.11,<4",
    "psycopg>=3.2.8,<4",
    "brotlipy>=0.7.0,<0.8.0",
    "django-log-request-id>=2.1.0,<3",
    "dj-database-url>=3.1.0,<4",
    "gunicorn>=26.0.0,<27",
    "whitenoise>=6.9.0,<7",
    "ipython>=9.0,<10",
    "sentry-sdk>=2.28.0,<3",
    "setuptools>=82.0.0,<83",
    "django-permissions-policy>=4.26.0,<5",
    "django-csp>=4.0,<5",
    "django-defender>=0.9.8,<0.10.0",
    "django-guid>=3.5.1,<4",
    "drf-spectacular>=0.29.0,<0.30.0",
    "drf-rw-serializers>=1.4.0,<2",
    "django-allauth[socialaccount,mfa]>=65.10.0,<66",
    "pillow>=12.0.0,<13",
    "django-virtual-models>=0.4.0,<0.5.0",
    "django-s3direct>=2.0.3,<3",
    "djangorestframework-simplejwt>=5.5.0,<6",
    "mercadopago>=3.2.0,<4",
    "boto3>=1.38.13,<2",
    "django-storages>=1.14.6,<2",
    "sqlalchemy>=2.0.40,<3",
    "python-git>=2018.2.1,<2019",
    "vintasend>=1.2.0,<2",
    "vintasend-django>=1.2.1,<2",
    "vintasend-celery>=1.2.0,<2",
    "celery-types>=0.26.0,<0.27.0",
    "pytest-xdist[psutil]>=3.6.1,<4",
    "django-filter>=25.1,<26",
    "dependency-injector>=4.47.0,<5",
    "cuid2>=2.0.1,<3",
    "google-api-python-client>=2.172.0,<3",
    "google-auth-httplib2>=0.4.0,<0.5.0",
    "google-auth-oauthlib>=1.2.2,<2",
    "django-fernet-encrypted-fields>=0.4.0,<0.5.0",
    "pyrate-limiter>=4.2.0,<5",
    "redis>=8.0.0,<9",
    "django-cors-headers>=4.7.0,<5",
    "twilio>=9.6.5,<10",
    "strawberry-graphql>=0.316.0,<0.317.0",
    "strawberry-graphql-django>=0.86.0,<0.87.0",
    "icalendar>=7.1.3,<8",
    "stripe>=15.3.1,<16",
    # Development Status :: Alpha. The minor is pinned deliberately: 0.1.0 changed
    # `OrganizationMembership.objects` scoping, 0.2.0 renamed both Django app
    # labels, 0.3.0 defaulted `STRICT_ORGANIZATION_FILTER` to `True`, and 0.4.0
    # deleted the whole function-based API (`vinta_orgs.helpers`, the module-level
    # organization-context functions) in favour of class-specialized generics --
    # so four consecutive minors carried a breaking change. 0.5.0 is the first
    # that does not: it only removes work from `save()`. Re-read the upstream
    # diff before widening this range anyway.
    "vinta-django-orgs>=0.5,<0.6",
    # Same reasoning as the vinta-django-orgs pin above: this package is also
    # Development Status :: Alpha, and its migration onto the host is itself
    # a multi-phase plan (see ai-plans/). Widen only after re-reading the
    # upstream diff for the target minor.
    "vinta-django-billing>=0.7,<0.8",
    # The audit log, extracted from this project. Pinned to the minor for the
    # same reason as its two siblings above: it is pre-1.0, so a minor is where a
    # breaking change is allowed to live. `audit_integration` supplies the scope
    # and identity models it points at, and subclasses its service and repository
    # -- read that app's README before widening this range.
    "vinta-django-audit-logs>=0.1.2,<0.2",
]

[dependency-groups]
dev = [
    "coverage>=7.2.7,<8",
    "model-bakery>=1.12.0,<2",
    "pre-commit>=4.0,<5",
    "ruff>=0.15.0,<0.16.0",
    "mypy>=2.0,<3",
    "django-stubs[compatible-mypy]>=6.0,<7",
    "djangorestframework-stubs[compatible-mypy]>=3.16.0,<4",
    "tblib>=3.1.0,<4",
    "freezegun>=1.5.1,<2",
    "pytest>=9.0,<10",
    "pytest-django>=4.11.1,<5",
    "pytest-cov>=7.0,<8",
    "pytest-timeout>=2.4.0,<3",
    "ipdb>=0.13.13,<0.14.0",
    "pytest-split>=0.11,<0.12",
]

[tool.uv]
package = false

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "virtualenvs",
    "**/migrations/**"
]
line-length = 100
indent-width = 4
# Deliberately ONE version behind the interpreter (which is 3.14 -- see
# requires-python). This setting decides which syntax ruff is willing to
# introduce, and both of 3.14's additions are ones this codebase does not want:
#
# * The formatter rewrites `except (OSError, ValueError):` into PEP 758's
#   `except OSError, ValueError:` across 17 files. Valid 3.14, but it reads like
#   the Python 2 `except E, name:` form it is not, for no benefit.
# * UP037 offers to strip the quotes from 317 forward references. Taking that
#   offer breaks dependency injection -- see the "UP037" entry under
#   lint.ignore, which stays in place as the second guard if this line is ever
#   moved to py314.
#
# Nothing here caps the interpreter; 3.14-only *library* features (uuid.uuid7)
# are used freely.
target-version = "py313"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pep8-naming
    "N",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-bandit
    "S",
    # flake8-blind-except
    "BLE",
    # flake8-builtins
    "A",
    # flake8-django
    "DJ",
    # isort
    "I",
    # flake8-logging-format
    "G",
    # flake8-no-pep420
    "INP",
    # Ruff-specific rules
    "RUF"
]
ignore = [
  # Disable eradicate (commented code removal)
  "ERA001",
  # Disable Conflicting lint rules,
  # see https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
  "W191",
  "E501",
  "E111",
  "E117",
  "D206",
  "D300",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "COM812",
  "COM819",
  "ISC001",
  "ISC002",
  # Disable unused `noqa` directive
  "RUF100",
  # Keep the quotes around forward references in annotations.
  #
  # On the py313 target they were mandatory. On py314, PEP 649 defers annotation
  # evaluation, so UP037 reads most of them as redundant and offers to strip all
  # 317. Taking that offer breaks dependency injection at runtime, which is not
  # something the type checker or the test collector would tell you about
  # quietly: `dependency_injector`'s `@inject` walks `__annotations__` looking
  # for `Annotated[..., Provide["..."]]` markers -- on services, DRF views and
  # Celery tasks alike -- and under PEP 649 reading `__annotations__` evaluates
  # them. A name imported only under `TYPE_CHECKING` then raises `NameError` at
  # injection time. Quoted, it stays an unresolved string inside `Annotated`,
  # the marker is still found, and the injection works.
  #
  # `[tool.ruff.lint.pyupgrade] keep-runtime-typing` does NOT cover UP037 (only
  # UP006/UP007/UP045), so the rule has to be named here.
  "UP037",
]
# Allow unused variables when underscore-prefixed:
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "django", "third-party", "first-party", "local-folder"]
lines-after-imports = 2

[tool.ruff.lint.isort.sections]
# Group all Django imports into a separate section.
"django" = ["django"]

[tool.ruff.lint.per-file-ignores]
# Ignore "E402", "F403", "F405" (import violations) in __init__.py files.
# Ignore "S" (flake8-bandit) and "N802" (function name should be lowercase) in tests and docs.
# Ignore "RUF" (Ruff-specific rules) and "I" (isort) in migrations.
"__init__.py" = ["E402", "F403", "F405"]
"**/{tests,docs}/*" = ["E402", "F403", "F405", "S", "N802"]
"**/*test*.py" = ["E402", "F403", "F405", "S", "N802"]
"**/{settings}/*" = ["E402", "F403", "F405"]
"**/migrations/*" = ["RUF", "I"]
# Skill template resources are standalone files copied into projects, not importable packages.
"ai-tools/skills/**/resources/*.py" = ["INP001"]
# One-off script folders are named `<YYYY-MM-DD>-<kebab>`, which is not a valid Python
# identifier, so they cannot be packages. Tests load `script.py` by path.
"scripts/one_off/*/*.py" = ["INP001"]

[tool.coverage.run]
branch = true
omit = [
  "manage.py",
  "conftest.py",
  "**/venv/*",
  "**/env/*",
  "**/virtualenvs/*",
  "**/node_modules/*",
  "**/migrations/*",
  "**/settings/*",
  "**/tests/*",
  "**/factories/*",
  "**/vinta_schedule_api/*"
]

[tool.mypy]
python_version = "3.14"
plugins = [
  "mypy_django_plugin.main",
  "mypy_drf_plugin.main",
]
# Two trees mypy cannot say anything useful about. Both already have the equivalent
# ruff per-file ignore above (INP001), for the same underlying reasons.
exclude = [
  # Vendored verbatim from the skills and refreshed by `vinta-sync-ai-tools`, so a fix
  # applied here is overwritten on the next sync -- the same reasoning as the
  # `scripts.one_off._base` override below, which this does not replace (that module is
  # a real import target, not a template).
  '^ai-tools/skills/.*/resources/',
  # One-off script folders are named `<YYYY-MM-DD>-<kebab>`: not valid Python
  # identifiers, so they cannot be packages, so `test_script.py` loads `script.py`
  # through `importlib.util.spec_from_file_location`. Everything it reaches that way is
  # invisible to static analysis -- mypy reported the script's own class as having no
  # attributes and its config dataclass as "not valid as a type". Nothing to fix in the
  # code; the folder layout is the constraint.
  '^scripts/one_off/[0-9]{4}-[0-9]{2}-[0-9]{2}-',
]

# Third-party packages that ship no stubs and no `py.typed`. `boto3` / `botocore` were
# missing from this list, but the `[tool.django-stubs]` plugin crash at the bottom of
# this file meant mypy never got far enough to say so.
[[tool.mypy.overrides]]
module = ["allauth.*", "googleapiclient.*", "storages.*", "twilio.*", "django_filters.*", "mercadopago.*", "s3direct.*", "encrypted_fields.*", "dateutil.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

# Vendored verbatim from the add-one-off-script skill and refreshed by
# `vinta-sync-ai-tools`. Local edits would be overwritten on the next sync, so it is
# checked as-is rather than patched.
[[tool.mypy.overrides]]
module = ["scripts.one_off._base"]
ignore_errors = true

[tool.django-stubs]
# The test settings, not `local` -- `.gitignore` excludes `**/settings/local.py`, so it
# exists only on a machine that copied `local.py.example` by hand. django-stubs imports
# this module while mypy is still loading plugins, so naming an absent one does not
# degrade to a type error: mypy dies with `INTERNAL ERROR -- Error constructing plugin
# instance of NewSemanalDjangoPlugin` before analysing a single file. `.test` is
# committed, so every checkout has it, and it is the module the suite already runs under
# (`pytest.ini`'s `--ds`), which keeps what mypy checks and what the tests exercise the
# same. Guarded by `common/tests/test_mypy_settings_module.py`, because mypy runs in
# neither CI nor pre-commit and nothing else would notice this rotting again.
django_settings_module = "vinta_schedule_api.settings.test"
