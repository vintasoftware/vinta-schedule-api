        resources:
          type: array
          items:
            $ref: '#/components/schemas/BillingPeriodResourceUsage'
          readOnly: true
          description: Every registered resource recorded for this period. Prefetched,
            so retrieving one statement is a bounded number of queries regardless
            of how many resources exist.
      required:
      - billing_interval
      - billing_period_end
      - billing_period_start
      - charged
      - closed_at
      - currency
      - id
      - overage_total
      - payment_id
      - plan_name
      - plan_slug
      - resources
