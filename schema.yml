        start_datetime:
          type: string
          format: date-time
        end_datetime:
          type: string
          format: date-time
        should_update_events:
          type: boolean
          default: false
      required:
      - end_datetime
      - start_datetime
    CalendarSyncStatusEnum:
      enum:
      - success
      - failed
      - in_progress
      - not_started
      type: string
      description: |-
        * `success` - Success
        * `failed` - Failed
        * `in_progress` - In Progress
        * `not_started` - Not Started
    CalendarTypeEnum:
      enum:
      - personal
      - resource
      - virtual
      - bundle
      type: string
      description: |-
        * `personal` - Personal Calendar
        * `resource` - Resource Calendar
        * `virtual` - Virtual Calendar
        * `bundle` - Bundle Calendar
    ChangePlanRequest:
      type: object
      description: |-
        Body of ``POST /billing/subscription/change-plan/``.

        ``payment_token`` is required in practice the *first* time a billing root
        ever attaches a payment instrument -- there is otherwise no provider-facing
        card/token to create the provider-side subscription against. Optional here
        (blank by default) because it is only actually required when
        ``Subscription.external_id`` is still blank; see
        ``SubscriptionService._initiate_upgrade`` for the exact condition and
        ``PaymentTokenRequiredError`` for the 400 a caller gets if it omits the
        token when one was needed.
      properties:
        plan_slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        billing_interval:
          allOf:
          - $ref: '#/components/schemas/PendingBillingIntervalEnum'
          default: monthly
        idempotency_key:
          type: string
          maxLength: 255
        payment_token:
          type: string
          maxLength: 255
      required:
      - idempotency_key
      - plan_slug
    ConceptDoc:
      type: object
      description: |-
        Read-only representation of a single concept doc's full content.

        Plain ``Serializer`` over a :class:`public_api.docs_content.ConceptDoc` dict —
        there is no model backing this. Returns raw markdown; the frontend owns
        rendering and sanitization.
      properties:
        slug:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
        markdown:
          type: string
          readOnly: true
      required:
      - markdown
      - slug
      - title
    ConceptDocSummary:
      type: object
      description: |-
        Read-only manifest entry for a concept doc (list view).

        Plain ``Serializer`` over a :class:`public_api.docs_content.ConceptDocSummary`
        dict — there is no model backing this.
      properties:
        slug:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
      required:
      - slug
      - title
    ConsentCreate:
      type: object
      description: |-
        Validates the input for the authenticated consent-record endpoint (OAuth step).

        ``document_type`` is required — the consenting user comes from the
        authenticated request, and audit metadata (IP, user-agent, source) is
        captured server-side in the view. ``phone_number`` is optional
        (phone-keyed consent): an OAuth user can consent a phone number here,
        before phone verification, so the SMS gate can later be satisfied for
        that phone.
      properties:
        document_type:
          $ref: '#/components/schemas/DocumentTypeEnum'
        phone_number:
          type: string
          maxLength: 20
      required:
      - document_type
    CurrentMembership:
      type: object
      description: |-
        Read-only serializer for the caller's current organization membership.

        Returns the caller's resolved permissions and the nested organization so the
        frontend can distinguish between an onboarded user and a gated
        (membership-less) user, and can gate its own UI on the same capability
        strings the server enforces.
      properties:
        permissions:
          type: array
          items:
            type: string
          description: 'Capabilities this membership confers in this organization,
            as ``app_label.codename`` strings (for example ``organizations.manage_members``).
            Resolved from the membership''s groups and direct grants -- the same source
            every server-side authorization check reads -- so a client can gate UI
            on the exact string the API will enforce. Only organization-scoped capabilities
            appear: a global Django permission or superuser status grants nothing
            here, because it grants nothing in this organization either. An inactive
            membership resolves an empty list. The set of possible values grows over
            time; treat an unrecognised entry as an unknown capability rather than
            an error.'
          readOnly: true
        organization:
          type: object
          additionalProperties: {}
          description: Serialize the related organization using OrganizationSerializer.
          readOnly: true
        can_manage_branding:
          type: boolean
          description: |-
            Whether this membership can manage branding.

            Computed from ``organizations.manage_branding`` plus parentless-and-
            entitled eligibility. Uses
            ``organizations.permissions.is_branding_eligible_organization`` for
            that eligibility, matching ``GET /branding/`` and logo-upload signing.
          readOnly: true
      required:
      - can_manage_branding
      - organization
      - permissions
    DocumentTypeEnum:
      enum:
      - privacy_policy
      - terms_of_use
      - sms_consent
      type: string
      description: |-
        * `privacy_policy` - Privacy Policy
        * `terms_of_use` - Terms of Use
        * `sms_consent` - SMS Messaging Consent
    EffectiveLimitUsage:
      type: object
      description: |-
        One row of ``GET /billing/usage/`` -- an ``EffectiveLimit`` paired with the
        ``current_usage`` ``EntitlementService.check_limit`` would compare it
        against. Not a ``ModelSerializer``: the source is a dataclass plus a
        separately-fetched usage count, not one model instance.
      properties:
        resource_key:
          type: string
        kind:
          type: string
          nullable: true
        limit_value:
          type: integer
          nullable: true
        current_usage:
          type: integer
          nullable: true
        overage_unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,4})?$
          nullable: true
        included_in_plan:
          type: integer
          nullable: true
          description: 'The plan-only portion of limit_value (SubscriptionPlanLimit.limit_value),
            before any add-on capacity. null under the same fail-open rule limit_value
            follows: no subscription, no plan-limit row for this resource, or an explicitly
            unlimited row.'
        add_on_quantity:
          type: integer
          description: The sum of every active SubscriptionAddOn's quantity for this
            resource. included_in_plan + add_on_quantity == limit_value whenever limit_value
            is non-null -- these two fields decompose limit_value, they do not redefine
            it.
        by_organization:
          type: array
          items:
            $ref: '#/components/schemas/UsageByOrganization'
          description: 'Per-organization attribution of current_usage across the caller''s
            pooled billing subtree. An organization that contributed nothing is omitted,
            never present with usage: 0. Ordered by organization_id ascending.'
      required:
      - add_on_quantity
      - by_organization
      - current_usage
      - included_in_plan
      - kind
      - limit_value
      - overage_unit_price
      - resource_key
    EntitlementKeyEnum:
      enum:
      - external_calendar_google
      - external_calendar_microsoft
      - partner_api
      - white_label_branding
      - advanced_scheduling
      type: string
      description: |-
        * `external_calendar_google` - Google Calendar sync
        * `external_calendar_microsoft` - Microsoft Calendar sync
        * `partner_api` - Partner / public API access
        * `white_label_branding` - White-label branding
        * `advanced_scheduling` - Advanced scheduling
    EventAttendance:
