    PatchedBookingPolicy:
      type: object
      description: |-
        Serializer for ``BookingPolicy`` CRUD.

        Exactly one of ``calendar``, ``membership_user_id``, ``appointment_type``, or
        ``is_organization_default`` must be set on create.  Targets are immutable
        after creation — only the four rule-field seconds are writable on update.

        Validation:
        - ``validate()`` enforces the exactly-one-target invariant on create.
        - ``validate_membership_user_id()`` checks that the supplied user id belongs
          to the caller's organization (on create only; targets are immutable on update).
        - ``DuplicateBookingPolicyError`` from the service is caught and surfaced as
          a 400 validation error so the client gets a named conflict message.
        - The four rule fields use ``min_value=0`` so DRF rejects negatives with a
          clear field-level 400 before the value reaches the model's
          ``PositiveIntegerField`` constraint.

        Write paths (create / update) delegate to ``BookingPolicyService`` stored on
        the serializer context as ``"booking_policy_service"`` (the viewset sets it).
      properties:
        id:
          type: integer
          readOnly: true
        calendar:
          type: integer
          nullable: true
        appointment_type:
          type: integer
          nullable: true
        membership_user_id:
          type: integer
          nullable: true
        is_organization_default:
          type: boolean
          default: false
        lead_time_seconds:
          type: integer
          minimum: 0
          default: 0
        max_horizon_seconds:
          type: integer
          minimum: 0
          default: 0
        buffer_before_seconds:
          type: integer
          minimum: 0
          default: 0
        buffer_after_seconds:
          type: integer
          minimum: 0
          default: 0
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
    PatchedCalendar:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
        email:
          type: string
          format: email
          readOnly: true
        external_id:
          type: string
          readOnly: true
        provider:
          allOf:
          - $ref: '#/components/schemas/ProviderEnum'
          readOnly: true
        calendar_type:
          allOf:
          - $ref: '#/components/schemas/CalendarTypeEnum'
          readOnly: true
          description: |-
            The type of calendar. Personal calendars are for individual use, resource calendars are for shared resources, and virtual calendars are for online meetings or events.

            * `personal` - Personal Calendar
            * `resource` - Resource Calendar
            * `virtual` - Virtual Calendar
            * `bundle` - Bundle Calendar
        capacity:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: The maximum number of attendees that can be accommodated in
            this calendar's events. This is only applicable for resource calendars.
        manage_available_windows:
          type: boolean
          description: If true, this calendar can manage its own available time windows.
            If not, it will use the available time windows of the external calendar
            it's attached to.
        visibility:
          allOf:
          - $ref: '#/components/schemas/VisibilityEnum'
          description: |-
            Controls how this calendar appears in queries. active: listed and available for booking (default). unlisted: hidden from listing/booking queries but still synced for conflict detection; survives re-import so user opt-out is preserved. inactive: soft-deleted, hidden from all queries and not synced. Use DELETE /calendars/{id}/ to transition to inactive instead of hard-deleting.

            * `active` - Active
            * `unlisted` - Unlisted
            * `inactive` - Inactive
        sync_enabled:
          type: boolean
          description: Whether this calendar's events are pulled from the external
            provider. Set to False to skip syncing calendars that aren't useful for
            scheduling — holidays, birthdays, organization-wide events, etc. When
            False, no new CalendarSync is requested for this calendar (including webhook-
            and import-triggered syncs); previously synced events are left untouched.
            Default True keeps existing calendars syncing as before.
    PatchedCalendarBundleUpdate:
      type: object
      description: Serializer for updating a bundle calendar's child calendars and
        primary calendar.
      properties:
        bundle_calendars:
          type: array
          items:
            type: integer
        primary_calendar:
          type: integer
          nullable: true
    PatchedCalendarEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        provider:
          type: string
          writeOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        timezone:
          type: string
          maxLength: 50
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        external_id:
          type: string
          readOnly: true
        external_attendances:
          type: array
          items:
            $ref: '#/components/schemas/EventExternalAttendance'
        attendances:
          type: array
          items:
            $ref: '#/components/schemas/EventAttendance'
        resource_allocations:
          type: array
          items:
            $ref: '#/components/schemas/ResourceAllocation'
        external_client_identifiers:
          type: array
          items:
            $ref: '#/components/schemas/ExternalClientIdentifier'
          description: Client-owned (system, identifier) pairs for this event. Omitted
            on a partial update leaves the stored set untouched; an explicit list
            (including []) replaces it.
        appointment_type_selections:
          type: array
          items:
            $ref: '#/components/schemas/CalendarEventAppointmentTypeSelection'
          readOnly: true
        recurrence_rule:
          allOf:
          - $ref: '#/components/schemas/RecurrenceRule'
          description: Recurrence rule data for creating recurring events
        rrule_string:
          type: string
          writeOnly: true
          description: RRULE string for creating recurring events
        parent_recurring_object_id:
          type: integer
          writeOnly: true
          description: ID of parent event for recurring instances
        parent_recurring_object:
          allOf:
          - $ref: '#/components/schemas/ParentEvent'
          readOnly: true
        is_recurring_instance:
          type: boolean
          description: True if this is an instance of a recurring event
          readOnly: true
        is_recurring:
          type: boolean
          description: True if this is a recurring event
          readOnly: true
        is_recurring_exception:
          type: boolean
          description: True if this object is an exception to the recurrence rule
            (modified occurrence)
        recurrence_id:
          type: string
          format: date-time
          nullable: true
          description: For recurring instances, this identifies which occurrence this
            is
        google_calendar_service_account:
          type: integer
          writeOnly: true
        calendar:
          type: integer
          writeOnly: true
    PatchedCalendarPool:
      type: object
      description: |-
        CalendarPool CRUD representation.

        On write, accepts `calendar_ids: list[int]` and replaces the roster
        wholesale; on read exposes the roster via `calendars` -- mirrors
        `AppointmentTypeSlotSerializer`. Persistence delegates to
        `AppointmentTypeService.create_pool` / `update_pool`; this serializer never
        writes `CalendarPool`/`CalendarPoolMembership` rows directly.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
        calendars:
          type: array
          items:
            $ref: '#/components/schemas/Calendar'
          readOnly: true
        calendar_ids:
          type: array
          items:
            type: integer
          writeOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
    PatchedOrganization:
      type: object
      description: |-
        Serializer for Organization instances.

        The ``google_service_account`` field supports both reading and writing:
        - **Write**: accepts ``email``, ``admin_email``,
          ``private_key_id`` (write-only), and ``private_key`` (write-only).
          Omitting the field on PATCH leaves existing credentials unchanged.
        - **Read**: returns ``email``, ``admin_email``, and ``configured: true/false``.
          Secret fields are never returned.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          description: 'Public, URL-safe identifier used by the organization''s branded
            login page and by brandingForTenant. Always set: an organization saved
            without one is given an opaque ``org-<token>`` slug, and the database
            refuses a blank value. Mutable, but not clearable -- changing it orphans
            previously-issued branded login URLs, which then fall back to the default
            identity rather than erroring. Format, reserved-word, and confusable-character
            rules live in organizations.slug_validation and are enforced by each write
            surface (REST serializer, admin form, GraphQL input), not on the model.'
          maxLength: 63
        should_sync_rooms:
          type: boolean
          description: Whether to sync rooms for this organization.
        external_event_update_policy:
          allOf:
          - $ref: '#/components/schemas/ExternalEventUpdatePolicyEnum'
          description: |-
            Policy for handling inbound external provider edits and deletions to synced events. ALLOW: apply directly. CHANGE_REQUEST: route to approval. FORBIDDEN: auto-undo.

            * `allow` - Allow direct updates
            * `change_request` - Updates create change requests
            * `forbidden` - Updates are forbidden
        week_start:
          allOf:
          - $ref: '#/components/schemas/OrganizationWeekStartEnum'
          description: |-
            Day of the week that starts the week for quota period boundaries. Used for calculating quota periods in group-scoped availability rules.

            * `monday` - Monday
            * `sunday` - Sunday
        google_service_account:
          type: object
          additionalProperties: {}
          nullable: true
          description: Return read-only service account info (no secrets), or None
            if unconfigured.
          readOnly: true
        can_invite_organizations:
          type: boolean
          readOnly: true
          description: Whether this organization can invite/create other organizations.
            DB/Django-admin only — never exposed via any API. Enables the whole reseller
            capability bundle.
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
    PatchedOrganizationBranding:
      type: object
      description: |-
        Serializer for OrganizationBranding (reseller-admin REST endpoints).

        Exposes app_name, logo_url, primary_color, secondary_color, support_email,
        and redirect_url. NEVER exposes can_invite_organizations or makes
        organization writable (the org is set from the acting org in the view).

        Validates:
        - Color format: #RRGGBB or #RRGGBBAA (regex).
        - redirect_url: HTTPS scheme, no wildcard character, no path-prefix pattern
          (organizations.redirect_url_validation).

        ``logo_url`` round-trips through ``BrandingLogoField``: reads return a
        time-limited signed URL for the stored object (``None`` when no logo is
        set), writes accept the uploaded S3 key from the ``branding_logos``
        S3Direct destination.
      properties:
        app_name:
          type: string
          description: The display name of the white-labeled app (e.g., 'MyScheduler').
          maxLength: 120
        logo_url:
          type: string
          nullable: true
        primary_color:
          type: string
          description: 'Primary color as hex code: #RRGGBB or #RRGGBBAA.'
          maxLength: 9
        secondary_color:
          type: string
          description: 'Secondary color as hex code: #RRGGBB or #RRGGBBAA.'
          maxLength: 9
        support_email:
          type: string
          format: email
          description: Email address for the From/reply-to on branded transactional
            emails.
          maxLength: 254
        redirect_url:
          type: string
          format: uri
          description: 'Single post-authentication redirect destination for this organization.
            Replaces the old return_url_allowlist: no caller-supplied redirect target
            is ever honored, so there is nothing to validate at request time and no
            open-redirect surface. Must be HTTPS with no wildcard character and no
            path-prefix pattern (organizations.redirect_url_validation).'
          maxLength: 200
    PatchedProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 255
        last_name:
          type: string
          maxLength: 255
        profile_picture:
          type: string
          nullable: true
          maxLength: 255
    PatchedServiceAccountWrite:
      type: object
      description: |-
        Write serializer for creating/rotating the org-level service account.

        ``private_key`` and ``private_key_id`` are write-only and are never echoed
        back in any response (reads go through ``ServiceAccountReadSerializer``).
      properties:
