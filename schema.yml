  /appointment-types/{appointment_type_id}/slots/{slot_id}/availability-windows/:
    get:
      operationId: appointment_types_slots_availability_windows_list
      description: |-
        Nested under an appointment type's slot: manage appointment-type-scoped availability windows
        for calendars in that slot's roster.

        Reads go through ``AvailableTime.objects.for_appointment_type_slot(...)``. Every
        write delegates to ``AppointmentTypeService`` -- this view holds
        no business logic of its own, only request/response translation. Route
        visibility is gated by ``AppointmentTypeScopedAvailabilityWindowPermission``; the
        per-calendar write authorization is re-checked by the service and its
        ``AppointmentTypeSlotConfigNotFoundError`` is translated to a 404 here so a
        denied write and a genuinely missing window are indistinguishable.
      parameters:
      - in: header
        name: X-Organization-Id
        schema:
          type: string
        description: Selects the active organization for this request. Optional for
          callers that belong to exactly one active organization — the single membership
          is resolved implicitly. **Required** when the caller has two or more active
          memberships; omitting it in that case returns **400**. If the header names
          an organization the caller is not an active member of, the server returns
          **403**.
      - in: path
        name: appointment_type_id
        schema:
          type: integer
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: path
        name: slot_id
        schema:
          type: integer
        required: true
      tags:
      - Appointment Type Scoped Availability Windows
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAppointmentTypeScopedAvailabilityWindowList'
          description: ''
    post:
      operationId: appointment_types_slots_availability_windows_create
      description: Creates an appointment-type-scoped availability window for a calendar
        within an appointment type slot's roster. If this is the calendar's FIRST
        appointment-type-scoped window (i.e. the write narrows it from base availability),
        confirmed future bookings that now fall outside it are returned in `orphaned_bookings`;
        nothing about them is modified.
      summary: Create an appointment-type-scoped availability window
      parameters:
      - in: header
        name: X-Organization-Id
        schema:
          type: string
        description: Selects the active organization for this request. Optional for
          callers that belong to exactly one active organization — the single membership
          is resolved implicitly. **Required** when the caller has two or more active
          memberships; omitting it in that case returns **400**. If the header names
          an organization the caller is not an active member of, the server returns
          **403**.
      - in: path
        name: appointment_type_id
        schema:
          type: integer
        required: true
      - in: path
        name: slot_id
        schema:
          type: integer
        required: true
      tags:
      - Appointment Type Scoped Availability Windows
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentTypeScopedAvailabilityWindowCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppointmentTypeScopedAvailabilityWindowCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppointmentTypeScopedAvailabilityWindowCreate'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentTypeScopedAvailabilityWriteResult'
          description: ''
