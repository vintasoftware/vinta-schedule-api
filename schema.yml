          type: array
          items:
            $ref: '#/components/schemas/AvailableResourcesEnum'
    PatchedWebhookConfiguration:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        event_type:
          $ref: '#/components/schemas/EventTypeEnum'
        url:
          type: string
          format: uri
          maxLength: 2000
        headers: {}
    PaymentProvider:
      type: object
      description: |-
        Response shape for ``GET /billing/payment-provider/`` and its unauthenticated
        ``/default/`` sibling: the resolved provider slug plus that provider's public
        credentials. Only the object matching ``provider`` is populated; the other is
        ``null``, so a client never receives keys for a provider it did not resolve to.

        Plain ``serializers.Serializer`` -- nothing here is DB-backed. Serializes a
        ``vinta_billing.services.provider_credentials.PublicProviderCredentials`` instance, not a
        model, hence the explicit ``to_representation`` rather than attribute-matching nested
        serializers (the dataclass's flat ``stripe_publishable_key``/``mercadopago_public_key``
        fields don't line up 1:1 with this serializer's nested ``stripe``/``mercadopago``
        objects).
      properties:
        provider:
          $ref: '#/components/schemas/PaymentProviderEnum'
        stripe:
          allOf:
          - $ref: '#/components/schemas/StripePublicCredentials'
          nullable: true
        mercadopago:
          allOf:
          - $ref: '#/components/schemas/MercadoPagoPublicCredentials'
          nullable: true
      required:
      - mercadopago
      - provider
      - stripe
    PaymentProviderEnum:
      enum:
      - mercadopago
      - stripe
      type: string
      description: |-
        * `mercadopago` - MercadoPago
        * `stripe` - Stripe
    PendingBillingIntervalEnum:
      enum:
      - monthly
      - annual
      type: string
      description: |-
        * `monthly` - Monthly
        * `annual` - Annual
    PeriodEnum:
