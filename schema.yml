components:
  schemas:
    AcceptInvitation:
      type: object
      description: Serializer for accepting invitations via public endpoint.
      properties:
        token:
          type: string
      required:
      - token
    AcceptInvitationResponse:
      type: object
      properties:
        message:
          type: string
        organization_id:
          type: integer
        organization_name:
          type: string
      required:
      - message
      - organization_id
      - organization_name
    ActionEnum:
      enum:
      - create
      - update
      - delete
      type: string
      description: |-
        * `create` - create
        * `update` - update
        * `delete` - delete
    AddOnPurchaseRequest:
      type: object
      description: |-
        Body of ``POST /billing/add-ons/``. See ``ChangePlanRequestSerializer``
        for why ``payment_token`` is required in practice despite being optional
        here -- an add-on purchase is a one-time charge and needs an instrument to
        charge, exactly like a first-ever plan upgrade does.
      properties:
        resource_key:
          $ref: '#/components/schemas/ResourceKeyEnum'
        quantity:
          type: integer
          minimum: 1
        is_recurring:
          type: boolean
          default: true
        idempotency_key:
          type: string
          maxLength: 255
        payment_token:
          type: string
          maxLength: 255
      required:
      - idempotency_key
      - quantity
      - resource_key
    AppointmentType:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
        duration:
          type: string
        accepts_public_scheduling:
          type: boolean
        slots:
          type: array
          items:
            $ref: '#/components/schemas/AppointmentTypeSlot'
        public_booking_slug:
          type: string
          readOnly: true
          description: 'Opaque, unguessable identifier used to address this appointment
            type on the unauthenticated codeless booking route, instead of the integer
            primary key. Uniqueness is GLOBAL (not scoped to organization) because
            that route carries no organization in its path -- the slug alone must
            identify exactly one appointment type system-wide. Authorizes nothing
            by itself: accepts_public_scheduling still gates codeless booking, and
            an appointment type later flipped to public already has its identifier.'
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
      required:
      - created
      - id
      - modified
      - name
      - public_booking_slug
      - slots
    AppointmentTypeAvailabilityQuery:
      type: object
      description: 'Input for the availability action: list of [start, end] windows.'
      properties:
        ranges:
          type: array
          items:
            $ref: '#/components/schemas/_RangeInput'
      required:
      - ranges
    AppointmentTypeEventCreate:
      type: object
      description: |-
        Input for booking an event through an AppointmentType.

        On `save()` this delegates to `AppointmentTypeService.create_appointment_type_event`
        and returns the created `CalendarEvent`. The view is responsible for
        serializing the result (typically with `CalendarEventSerializer`).
      properties:
        title:
          type: string
        description:
          type: string
          default: ''
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        timezone:
          type: string
        slot_selections:
          type: array
          items:
            $ref: '#/components/schemas/_AppointmentTypeSlotSelectionInput'
        attendances:
          type: array
          items:
            type: object
            additionalProperties: {}
        external_attendances:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - end_time
      - slot_selections
      - start_time
      - timezone
      - title
    AppointmentTypeRangeAvailability:
      type: object
      properties:
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        slots:
          type: array
          items:
            $ref: '#/components/schemas/AppointmentTypeSlotAvailability'
      required:
      - end_time
      - slots
      - start_time
    AppointmentTypeScopedAvailabilityOrphanedBooking:
      type: object
      description: |-
        Minimal identification of a booking a narrowing write orphaned (spec UC-6)
        -- enough for an admin to act on. Nothing about the booking itself is
        modified by the write that produced this entry.
      properties:
        id:
          type: integer
          readOnly: true
        calendar_id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        start_time:
          type: string
          format: date-time
          readOnly: true
        end_time:
          type: string
          format: date-time
          readOnly: true
      required:
      - calendar_id
      - end_time
      - id
      - start_time
      - title
    AppointmentTypeScopedAvailabilityWindow:
      type: object
      description: |-
        Read representation of an appointment-type-scoped availability window.

        Deliberately narrower than ``AvailableTimeSerializer``: there is no nested
        ``recurrence_rule`` write path here, only ``rrule_string`` -- matching
        exactly what ``AppointmentTypeService``'s window-write methods accept, so the
        REST shape and the service signature cannot drift apart.
      properties:
        id:
          type: integer
          readOnly: true
        calendar_id:
          type: integer
          readOnly: true
        appointment_type_slot_id:
          type: integer
          readOnly: true
        start_time:
          type: string
          format: date-time
          readOnly: true
        end_time:
          type: string
          format: date-time
          readOnly: true
        timezone:
          type: string
          readOnly: true
        rrule_string:
          type: string
          nullable: true
          description: RRULE string for the window's recurrence, or ``None`` when
            it doesn't recur.
          readOnly: true
        is_recurring:
          type: boolean
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
      required:
      - appointment_type_slot_id
      - calendar_id
      - created
      - end_time
      - id
      - is_recurring
      - modified
      - rrule_string
      - start_time
      - timezone
    AppointmentTypeScopedAvailabilityWindowCreate:
      type: object
      description: |-
        Input for creating an appointment-type-scoped availability window.

        Field names map 1:1 onto
        ``AppointmentTypeService.create_appointment_type_scoped_availability_window``'s keyword
        arguments (``calendar_id``, ``start_time``, ``end_time``, ``tz``,
        ``rrule_string``) so the REST shape can never silently drift from the
        service signature it delegates to.
      properties:
        calendar:
          type: integer
          description: Calendar this window applies to. Must be a member of the target
            slot.
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        timezone:
          type: string
        rrule_string:
          type: string
          nullable: true
          description: RRULE string for a recurring window. Omit for a one-off window.
      required:
      - calendar
      - end_time
      - start_time
      - timezone
    AppointmentTypeScopedAvailabilityWriteResult:
      type: object
      description: |-
        Wraps an ``AppointmentTypeScopedAvailabilityWriteResult``: the saved window plus any
        confirmed future bookings the write orphaned. Returned by the create and
        update actions of ``AppointmentTypeScopedAvailabilityWindowViewSet``.
      properties:
        window:
          allOf:
          - $ref: '#/components/schemas/AppointmentTypeScopedAvailabilityWindow'
          readOnly: true
        orphaned_bookings:
          type: array
          items:
            $ref: '#/components/schemas/AppointmentTypeScopedAvailabilityOrphanedBooking'
          readOnly: true
          description: Confirmed future bookings in this slot for this window's calendar
            that no longer fall inside the calendar's appointment-type-scoped availability
            after this write. Nothing about them is modified or cancelled -- act on
            them manually if needed.
      required:
      - orphaned_bookings
      - window
    AppointmentTypeScopedBlockOrphanedBooking:
      type: object
      description: |-
        Minimal identification of a booking a block write orphaned (spec
        UC-6's rule applied to blocks) -- enough for an admin to act on. Nothing
        about the booking itself is modified by the write that produced this
        entry.
      properties:
        id:
          type: integer
          readOnly: true
        calendar_id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        start_time:
          type: string
          format: date-time
          readOnly: true
        end_time:
          type: string
          format: date-time
          readOnly: true
      required:
      - calendar_id
      - end_time
      - id
      - start_time
      - title
    AppointmentTypeScopedBlockWriteResult:
      type: object
      description: |-
        Wraps an ``AppointmentTypeScopedBlockWriteResult``: the saved block plus any
        confirmed future bookings the write orphaned. Returned by the create and
        update actions of ``AppointmentTypeScopedBlockedTimeViewSet``.
      properties:
        block:
          allOf:
          - $ref: '#/components/schemas/AppointmentTypeScopedBlockedTime'
          readOnly: true
        orphaned_bookings:
          type: array
          items:
            $ref: '#/components/schemas/AppointmentTypeScopedBlockOrphanedBooking'
          readOnly: true
          description: Confirmed future bookings in this slot for this block's calendar
            that now fall inside the calendar's appointment-type-scoped blocked time
            after this write. Nothing about them is modified or cancelled -- act on
            them manually if needed.
      required:
      - block
      - orphaned_bookings
    AppointmentTypeScopedBlockedTime:
      type: object
      description: |-
        Read representation of an appointment-type-scoped blocked time.

        Mirrors ``AppointmentTypeScopedAvailabilityWindowSerializer`` exactly, plus
        ``reason`` -- there is no nested ``recurrence_rule`` write path here,
        only ``rrule_string``, matching exactly what ``AppointmentTypeService``'s
        block-write methods accept, so the REST shape and the service signature
        cannot drift apart.
      properties:
        id:
          type: integer
          readOnly: true
        calendar_id:
          type: integer
          readOnly: true
        appointment_type_slot_id:
          type: integer
          readOnly: true
        start_time:
          type: string
          format: date-time
          readOnly: true
        end_time:
          type: string
          format: date-time
          readOnly: true
        timezone:
          type: string
          readOnly: true
        reason:
          type: string
          readOnly: true
        rrule_string:
          type: string
          nullable: true
          description: RRULE string for the block's recurrence, or ``None`` when it
            doesn't recur.
          readOnly: true
        is_recurring:
          type: boolean
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
      required:
      - appointment_type_slot_id
      - calendar_id
      - created
      - end_time
      - id
      - is_recurring
      - modified
      - reason
      - rrule_string
      - start_time
      - timezone
    AppointmentTypeScopedBlockedTimeCreate:
      type: object
      description: |-
        Input for creating an appointment-type-scoped blocked time.

        Field names map 1:1 onto
        ``AppointmentTypeService.create_appointment_type_scoped_blocked_time``'s keyword
        arguments (``calendar_id``, ``start_time``, ``end_time``, ``tz``,
        ``reason``, ``rrule_string``) so the REST shape can never silently drift
        from the service signature it delegates to.
      properties:
        calendar:
          type: integer
          description: Calendar this block applies to. Must be a member of the target
            slot.
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        timezone:
          type: string
        reason:
          type: string
          default: ''
        rrule_string:
          type: string
          nullable: true
          description: RRULE string for a recurring block. Omit for a one-off block.
      required:
      - calendar
      - end_time
      - start_time
      - timezone
    AppointmentTypeScopedQuotaRule:
      type: object
      description: |-
        Read representation of an appointment-type-scoped quota rule.

        Simpler than ``AppointmentTypeScopedAvailabilityWindowSerializer``/
        ``AppointmentTypeScopedBlockedTimeSerializer``: quota rules are non-recurring (no
        ``rrule_string``, no ``timezone``, no time range) -- just the period and
        the cap, matching exactly what ``AppointmentTypeService``'s quota-write
        methods accept, so the REST shape and the service signature cannot drift
        apart.
      properties:
        id:
          type: integer
          readOnly: true
        calendar_id:
          type: integer
          readOnly: true
        appointment_type_slot_id:
          type: integer
          readOnly: true
        period:
          allOf:
          - $ref: '#/components/schemas/PeriodEnum'
          readOnly: true
          description: |-
            Fixed calendar period the cap applies to (day, week, or month).

            * `day` - Day
            * `week` - Week
            * `month` - Month
        cap:
          type: integer
          readOnly: true
          description: Maximum number of live bookings made through this appointment
            type slot a calendar may hold within one period. Must be at least 1.
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
      required:
      - appointment_type_slot_id
      - calendar_id
      - cap
      - created
      - id
      - modified
      - period
    AppointmentTypeScopedQuotaRuleCreate:
      type: object
      description: |-
        Input for creating an appointment-type-scoped quota rule.

        Field names map 1:1 onto
        ``AppointmentTypeService.create_appointment_type_scoped_quota_rule``'s keyword
        arguments (``calendar_id``, ``period``, ``cap``) so the REST shape can
        never silently drift from the service signature it delegates to.
      properties:
        calendar:
          type: integer
          description: Calendar this quota rule applies to. Must be a member of the
            target slot.
        period:
          allOf:
          - $ref: '#/components/schemas/PeriodEnum'
          description: |-
            Fixed calendar period the cap applies to (day, week, or month).

            * `day` - Day
            * `week` - Week
            * `month` - Month
        cap:
          type: integer
          minimum: 1
          description: Maximum number of live bookings made through this appointment
            type slot the calendar may hold within one period.
      required:
      - calendar
      - cap
      - period
    AppointmentTypeSlot:
      type: object
      description: |-
        Nested slot representation used inside AppointmentTypeSerializer.

        On write, accepts `calendar_ids: list[int]`; on read exposes the calendar
        pool via `calendars` (the M2M). We deliberately keep slot writes to
        payload-time data only — persistence happens through
        `AppointmentTypeSerializer` which delegates to `AppointmentTypeService`.

        `pool_ids` (write-only) attaches/detaches `CalendarPool`s -- **omitting**
        it leaves the slot's current attachments unchanged; an explicit `[]`
        detaches every pool. This mirrors `AppointmentTypeSlotInputData.pool_ids`
        exactly, and the distinction is resolved in
        `AppointmentTypeSerializer._to_input_data` by checking key presence in the
        validated per-slot dict, not by inspecting the value. `pools` (read-only)
        exposes the attached pools themselves.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
        order:
          type: integer
          maximum: 32767
          minimum: 0
        required_count:
          type: integer
          maximum: 32767
          minimum: 0
          description: How many calendars from the pool must be selected when booking.
            Default 1; use larger values when a slot needs multiple calendars (e.g.
            two nurses).
        calendars:
          type: array
          items:
            $ref: '#/components/schemas/Calendar'
          readOnly: true
        calendar_ids:
          type: array
          items:
            type: integer
          writeOnly: true
        pools:
          type: array
          items:
            $ref: '#/components/schemas/CalendarPool'
          readOnly: true
        pool_ids:
          type: array
          items:
            type: integer
          writeOnly: true
      required:
      - calendar_ids
      - calendars
      - id
      - name
      - pools
    AppointmentTypeSlotAvailability:
      type: object
      properties:
        slot_id:
          type: integer
        available_calendar_ids:
          type: array
          items:
            type: integer
        required_count:
          type: integer
        is_bookable:
          type: boolean
          readOnly: true
      required:
      - available_calendar_ids
      - is_bookable
      - required_count
      - slot_id
    AssignMembershipGroups:
      type: object
      description: |-
        Request serializer for ``POST /organization-members/{user_id}/groups/``.

        The one place in the API where a *group* name is accepted rather than a
        permission: assigning a group is the act of choosing one, so there is
        nothing to abstract. Reads report capabilities instead (``permissions``
        above), which is why a later per-organization group layer would not be a
        second client break.

        ``ChoiceField`` over the seeded names rather than a free ``CharField``: an
        unknown group must be a 400 that names the acceptable values, not a silent
        no-op. The list may not be empty -- "no groups at all" is not a state any
        write path produces; a member with no capabilities is
        ``["organization_member"]``.
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/GroupsEnum'
          description: Groups to assign to this membership, replacing the ones it
            holds. ``organization_admin`` carries every capability; ``organization_billing_owner``
            carries ``vinta_billing.manage_billing``; ``organization_member`` carries
            none and is what a member with no capabilities holds. Naming a capability
            group alongside ``organization_member`` stores the capability group alone.
      required:
      - groups
