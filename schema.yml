  /appointment-types/{appointment_type_id}/slots/{slot_id}/blocked-times/:
    get:
      operationId: appointment_types_slots_blocked_times_list
      description: |-
        Nested under an appointment type's slot: manage appointment-type-scoped blocked times for
        calendars in that slot's roster.

        Direct mirror of ``AppointmentTypeScopedAvailabilityWindowViewSet`` -- reads go
        through ``BlockedTime.objects.for_appointment_type_slot(...)``, every write
        delegates to the ``AppointmentTypeService`` block-write methods,
        and route visibility is gated by ``AppointmentTypeScopedBlockedTimePermission``.
        See that viewset's docstring for the full rationale; only the resource
        it manages differs (blocks instead of windows).
      parameters:
      - in: header
        name: X-Organization-Id
        schema:
          type: string
        description: Selects the active organization for this request. Optional for
          callers that belong to exactly one active organization — the single membership
          is resolved implicitly. **Required** when the caller has two or more active
          memberships; omitting it in that case returns **400**. If the header names
          an organization the caller is not an active member of, the server returns
          **403**.
      - in: path
        name: appointment_type_id
        schema:
          type: integer
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: path
        name: slot_id
        schema:
          type: integer
        required: true
      tags:
      - Appointment Type Scoped Blocked Times
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAppointmentTypeScopedBlockedTimeList'
          description: ''
    post:
      operationId: appointment_types_slots_blocked_times_create
      description: Creates an appointment-type-scoped blocked time for a calendar
        within an appointment type slot's roster. Confirmed future bookings in that
        appointment type for that calendar that now fall INSIDE the block are returned
        in `orphaned_bookings`; nothing about them is modified.
      summary: Create an appointment-type-scoped blocked time
      parameters:
      - in: header
        name: X-Organization-Id
        schema:
          type: string
        description: Selects the active organization for this request. Optional for
          callers that belong to exactly one active organization — the single membership
          is resolved implicitly. **Required** when the caller has two or more active
          memberships; omitting it in that case returns **400**. If the header names
          an organization the caller is not an active member of, the server returns
          **403**.
      - in: path
        name: appointment_type_id
        schema:
          type: integer
        required: true
      - in: path
        name: slot_id
        schema:
          type: integer
        required: true
      tags:
      - Appointment Type Scoped Blocked Times
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentTypeScopedBlockedTimeCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppointmentTypeScopedBlockedTimeCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppointmentTypeScopedBlockedTimeCreate'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
