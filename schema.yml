        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryPaymentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RetryPaymentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RetryPaymentRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
          description: The new instrument was attached and the outstanding balance
            was submitted for collection at the provider. Recovery is webhook-driven
            -- the subscription in this response is still `"grace"`/`"restricted"`;
            it moves to `"active"` only once the subscription-payment webhook confirms
            the charge.
        '400':
          description: '`payment_token` or `idempotency_key` is missing.'
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingErrorBody'
          description: 'The new instrument was attached, but the provider declined
            the charge against it, or refused to attempt it at all (`code: "charge_declined"`,
            `ChargeDeclinedError`). Distinct from the over-limit 402 rendered elsewhere
            in this API (`OverLimitError`, `code: "limit_exceeded"`) -- both use 402
            Payment Required, `code` disambiguates. The subscription stays GRACE/RESTRICTED.
            A subscription can carry more than one outstanding invoice; if an earlier
            one was paid before a later one hit this decline, a partial collection
            may already have occurred -- submit a different `payment_token` to retry
            the remainder, do not assume nothing moved.'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingErrorBody'
          description: 'One of four conflicts: the subscription is not currently GRACE/RESTRICTED
            (`code: "retry_payment_not_applicable"`, `RetryPaymentNotApplicableError`);
            it has never attached a payment instrument at the provider (`code: "subscription_not_attached"`,
            `SubscriptionNotAttachedError` -- such an organization has never paid
            and belongs on `change-plan`''s first-upgrade path instead); the provider
            reports nothing actually owed for this subscription right now (`code:
            "no_outstanding_balance"`, `NoOutstandingBalanceError`); or the resolved
            provider has no verified balance-collection primitive to drive (`code:
            "collection_not_supported"`, `CollectionNotSupportedError` -- MercadoPago,
            as of this writing).'
