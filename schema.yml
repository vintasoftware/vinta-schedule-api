  /billing/add-ons/:
    post:
      operationId: billing_add_ons_create
      description: |-
        ``POST /billing/add-ons/`` (purchase capacity), ``DELETE
        /billing/add-ons/{id}/`` (stop a recurring add-on from renewing).

        ``SubscriptionAddOnSerializer`` is a plain ``ModelSerializer`` -- no
        nested relation heavy enough to warrant a virtual model (see
        ``vinta_billing/virtual_models.py``) -- so this does not mix in
        ``GenericVirtualModelViewMixin``, unlike ``SubscriptionViewSet``.
      summary: Purchase additional capacity
      parameters:
      - in: header
        name: X-Organization-Id
        schema:
          type: string
        description: Selects the active organization for this request. Optional for
          callers that belong to exactly one active organization — the single membership
          is resolved implicitly. **Required** when the caller has two or more active
          memberships; omitting it in that case returns **400**. If the header names
          an organization the caller is not an active member of, the server returns
          **403**.
      tags:
      - billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddOnPurchaseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddOnPurchaseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddOnPurchaseRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionAddOn'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingErrorBody'
          description: 'The resource''s current plan limit carries no `overage_unit_price`,
            so it has no catalog-derived price to purchase as an add-on (`code: "add_on_not_purchasable"`,
            `AddOnNotPurchasableError`).'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingErrorBody'
          description: 'The provider this organization resolves to is not configured
            in this deployment, so the one-time charge cannot be driven (`code: "payment_provider_not_configured"`,
            `PaymentProviderNotConfiguredError`). A deployment fault, not a bad request
            -- retrying the same call changes nothing until an operator configures
            the provider.'
