          scoped to an appointment type (not a single calendar). OPTIONAL on this
          endpoint only: when omitted, the booking is authorized instead by the path
          appointment type''s own accepts_public_scheduling flag (codeless public
          appointment type booking, GraphQL parity with createAppointmentTypeEvent).
          When present, the coded path always wins -- a public appointment type handed
          a valid appointment type code still books through it and consumes it.'
