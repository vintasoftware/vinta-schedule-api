  /appointment-types/{id}/stale-selections/:
    get:
      operationId: appointment_types_stale_selections_list
      description: Every `(event, slot, calendar)` triple booked under this appointment
        type whose calendar has since left its slot's roster (removed inline, or via
        a pool detaching or losing that calendar) -- the ops-sweep counterpart to
        the per-selection `is_in_current_roster` flag. Optionally bounded to events
        overlapping `[window_start, window_end)`; omitting both returns every stale
        selection in the appointment type regardless of when its event falls. Returns
        a bare array, page-bounded by `offset`/`limit` -- this exists specifically
        to expose a potentially large backlog, so the result set is never fetched
        or materialized unbounded.
      summary: List stale calendar selections for this appointment type
      parameters:
      - in: header
        name: X-Organization-Id
        schema:
          type: string
        description: Selects the active organization for this request. Optional for
          callers that belong to exactly one active organization — the single membership
          is resolved implicitly. **Required** when the caller has two or more active
          memberships; omitting it in that case returns **400**. If the header names
          an organization the caller is not an active member of, the server returns
          **403**.
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: query
        name: limit
        schema:
          type: integer
        description: Max rows to return, 1-100. Defaults to 100.
      - in: query
        name: offset
        schema:
          type: integer
        description: Number of rows to skip. Defaults to 0.
      - in: query
        name: window_end
        schema:
          type: string
        description: Only events starting before this instant (ISO 8601). Optional.
      - in: query
        name: window_start
        schema:
          type: string
        description: Only events ending after this instant (ISO 8601). Optional.
      tags:
      - appointment-types
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaleSelection'
          description: ''
