    CalendarEventWithManagementCodes:
      type: object
      description: |-
        ``CalendarEventSerializer`` plus the self-service ``management`` object.

        Used ONLY to render the ``201`` response of a booking-code create or
        reschedule viewset (``BookingCodeCalendarEventViewSet``,
        ``BookingCodeAppointmentTypeEventViewSet``, ``BookingCodeRescheduleEventViewSet``,
        ``BookingCodeRescheduleAppointmentTypeEventViewSet``) -- never for a read, and
        never for ``get_optimized_queryset``: ``management`` is not a model field
        or relation, it does not exist on ``CalendarEventVirtualModel``, and
        django-virtual-models' ``LookupFinder`` would raise
        ``MissingVirtualModelFieldException`` if this subclass were ever handed
        to ``get_optimized_queryset`` (it walks every readable field looking for
        a matching virtual-model entry). Callers therefore build the optimized
        queryset with the PLAIN ``CalendarEventSerializer`` first, and only use
        this subclass afterwards, purely to render ``.data`` on the already-
        fetched instance.

        The view sets ``event.management`` (a plain object carrying
        ``reschedule_code`` / ``cancel_code``, matching
        ``BookingManagementCodesSerializer``'s two fields) on the event instance
        before calling this serializer -- there is nothing in the database for
        this field to read, ``to_representation`` finds it via a plain
        ``getattr(instance, "management")``, same as any other declared field.
      properties:
        id:
          type: integer
          readOnly: true
        provider:
          type: string
          writeOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        timezone:
          type: string
          maxLength: 50
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        external_id:
          type: string
          readOnly: true
        external_attendances:
          type: array
          items:
            $ref: '#/components/schemas/EventExternalAttendance'
        attendances:
          type: array
          items:
            $ref: '#/components/schemas/EventAttendance'
        resource_allocations:
          type: array
          items:
            $ref: '#/components/schemas/ResourceAllocation'
        external_client_identifiers:
          type: array
          items:
            $ref: '#/components/schemas/ExternalClientIdentifier'
          description: Client-owned (system, identifier) pairs for this event. Omitted
            on a partial update leaves the stored set untouched; an explicit list
            (including []) replaces it.
        appointment_type_selections:
          type: array
          items:
            $ref: '#/components/schemas/CalendarEventAppointmentTypeSelection'
          readOnly: true
        recurrence_rule:
          allOf:
          - $ref: '#/components/schemas/RecurrenceRule'
          description: Recurrence rule data for creating recurring events
        rrule_string:
          type: string
          writeOnly: true
          description: RRULE string for creating recurring events
        parent_recurring_object_id:
          type: integer
          writeOnly: true
          description: ID of parent event for recurring instances
        parent_recurring_object:
          allOf:
          - $ref: '#/components/schemas/ParentEvent'
          readOnly: true
        is_recurring_instance:
          type: boolean
          description: True if this is an instance of a recurring event
          readOnly: true
        is_recurring:
          type: boolean
          description: True if this is a recurring event
          readOnly: true
        is_recurring_exception:
          type: boolean
          description: True if this object is an exception to the recurrence rule
            (modified occurrence)
        recurrence_id:
          type: string
          format: date-time
          nullable: true
          description: For recurring instances, this identifies which occurrence this
            is
        management:
          allOf:
          - $ref: '#/components/schemas/BookingManagementCodes'
          readOnly: true
        google_calendar_service_account:
          type: integer
          writeOnly: true
        calendar:
          type: integer
          writeOnly: true
      required:
      - appointment_type_selections
      - attendances
      - created
      - end_time
      - external_attendances
      - external_id
      - id
      - is_recurring
      - is_recurring_instance
      - management
      - modified
      - parent_recurring_object
      - resource_allocations
      - start_time
      - timezone
      - title
    CalendarPool:
      type: object
      description: |-
        CalendarPool CRUD representation.

        On write, accepts `calendar_ids: list[int]` and replaces the roster
        wholesale; on read exposes the roster via `calendars` -- mirrors
        `AppointmentTypeSlotSerializer`. Persistence delegates to
        `AppointmentTypeService.create_pool` / `update_pool`; this serializer never
        writes `CalendarPool`/`CalendarPoolMembership` rows directly.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
        calendars:
          type: array
          items:
            $ref: '#/components/schemas/Calendar'
          readOnly: true
        calendar_ids:
          type: array
          items:
            type: integer
          writeOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
      required:
      - calendar_ids
      - calendars
      - created
      - id
      - modified
      - name
    CalendarSync:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/CalendarSyncStatusEnum'
          readOnly: true
        start_datetime:
          type: string
          format: date-time
        end_datetime:
          type: string
          format: date-time
        should_update_events:
          type: boolean
        trigger_source:
