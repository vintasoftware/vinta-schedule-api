      properties:
        code:
          type: string
        detail:
          type: string
      required:
      - code
      - detail
    BillingPeriodBounds:
      type: object
      description: |-
        The ``[start, end)`` bounds of the cycle in progress right now, resolved
        through the same anchor (``resolve_billing_period`` /
        ``current_billing_period_start``) the meter and the usage counters use --
        never read off ``Subscription.current_period_start`` directly, which goes
        stale the moment one cycle elapses. ``null`` when there is no subscription.
      properties:
        start:
          type: string
          format: date-time
          description: Inclusive start of the current billing period.
        end:
          type: string
          format: date-time
          description: Exclusive end of the current billing period.
      required:
      - end
      - start
    BillingPeriodResourceUsage:
      type: object
      description: |-
        One resource's snapshot as of a closed billing period
        (``BillingPeriodResourceUsage``), nested under ``GET
        /billing/usage/periods/{id}/``'s ``resources`` key.

        ``reconciliation_unmetered``/``reconciliation_orphaned`` live on the parent
        ``BillingPeriodSummary`` row, not here, and neither is serialized anywhere
        in this module -- internal investigation data, surfaced only in Django
        admin.
      properties:
        resource_key:
          type: string
          description: The registered resource this row reports on.
        kind:
          type: string
          nullable: true
          description: prepaid or postpaid, as classified at close time. null when
            this resource's limit could not be resolved at close.
        total:
          type: integer
          nullable: true
          description: This resource's usage as counted at close, summed across the
            pooled subtree. null means the count was **not recorded** -- a period
            that closed before this feature shipped, or a registered resource added
            after this period closed -- and must never be displayed as 0. A recorded
            usage of zero serializes as the integer 0, distinct from null.
        limit_value:
          type: integer
          nullable: true
          description: The effective ceiling in force at close time. null means **unlimited**
            -- a different null than total's; a client must not collapse the two into
            the same meaning.
        overage_unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,4})?$
          nullable: true
          description: Price per unit of overage. For event_occurrences with at least
            one overage row this period, stamped from those MeteredOccurrence rows
            rather than the live effective limit, so a later price change cannot make
            this row disagree with overage_total. null for a prepaid resource, or
            when no single stamped price applies to this period.
        by_organization:
          type: array
          items:
            $ref: '#/components/schemas/UsageByOrganization'
          description: 'Per-organization contribution to total, across the pooled
            subtree at close time. An organization that contributed nothing is omitted,
            never present with usage: 0. Ordered by organization_id ascending -- the
            identical shape GET /billing/usage/''s by_organization uses. Names are
            resolved at **read time** against the organizations table, so they reflect
            each organization''s current name, not its name as of when this period
            closed -- this row has no name snapshot. An organization that no longer
            exists renders with name: "" rather than being dropped from the list;
            its count still counts toward total.'
      required:
      - by_organization
      - kind
      - limit_value
      - overage_unit_price
      - resource_key
      - total
    BillingPeriodSummary:
      type: object
      description: |-
        One closed billing period, as a durable statement -- one row of ``GET
        /billing/usage/periods/``. See ``BillingPeriodSummaryDetailSerializer`` for
        the ``resources`` breakdown the detail action adds.

        ``reconciliation_unmetered``/``reconciliation_orphaned`` are deliberately
        absent from every field below -- internal investigation data, surfaced only
        in Django admin.
      properties:
        id:
          type: integer
          description: pk of this statement.
        billing_period_start:
          type: string
          format: date-time
          description: Inclusive start of the closed period.
        billing_period_end:
          type: string
          format: date-time
          description: Exclusive end of the closed period.
        plan_slug:
          type: string
          description: The billing plan in force for this period, snapshotted at close
            time -- a later plan change does not rewrite this.
        plan_name:
          type: string
          description: Display name of the plan in force for this period.
        billing_interval:
          type: string
          description: The subscription's billing interval for this period.
        currency:
          type: string
          description: The plan's currency for this period, e.g. "USD".
        overage_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
          description: Overage money charged for this period.
        charged:
          type: boolean
          description: Whether an overage charge was actually made for this period.
        payment_id:
          type: integer
          nullable: true
          description: pk of the Payment that settled this period's overage. null
            when charged is false.
        closed_at:
          type: string
          format: date-time
          description: When CycleCloseService wrote this statement.
      required:
      - billing_interval
      - billing_period_end
      - billing_period_start
      - charged
      - closed_at
      - currency
      - id
      - overage_total
      - payment_id
      - plan_name
      - plan_slug
    BillingPeriodSummaryDetail:
      type: object
      description: |-
        ``GET /billing/usage/periods/{id}/`` -- one statement's full detail,
        adding its per-resource breakdown to every field
        ``BillingPeriodSummarySerializer`` already reports.
      properties:
        id:
          type: integer
          description: pk of this statement.
        billing_period_start:
          type: string
          format: date-time
          description: Inclusive start of the closed period.
        billing_period_end:
          type: string
          format: date-time
          description: Exclusive end of the closed period.
        plan_slug:
          type: string
          description: The billing plan in force for this period, snapshotted at close
            time -- a later plan change does not rewrite this.
        plan_name:
          type: string
          description: Display name of the plan in force for this period.
        billing_interval:
          type: string
          description: The subscription's billing interval for this period.
        currency:
          type: string
