      - modified
    ExternalClientIdentifier:
      type: object
      description: |-
        One ``(system, identifier)`` client-owned reference pair.

        ``system`` is normalized (case + trailing slash) and validated as an absolute
        URL by ``ExternalClientIdentifierService`` before storage/matching -- this
        input layer does no format validation of its own, matching the public
        GraphQL ``ExternalClientIdentifierInput``. See
        ``calendar_integration.external_client_identifiers.normalize_system``.
      properties:
        system:
          type: string
          maxLength: 500
        identifier:
          type: string
          maxLength: 255
      required:
      - identifier
      - system
    ExternalEventChangeRequest:
      type: object
      description: |-
        Read-only serializer for ``ExternalEventChangeRequest``.

        Exposes the fields needed by the first-party frontend to list, approve,
        and reject change requests.  The ``resolved_by`` field surfaces only the
        user id and display name — never raw membership / organization ids — to
        avoid leaking cross-tenant identity data.
      properties:
        id:
          type: integer
          readOnly: true
        event_id:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/ExternalEventChangeRequestKindEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ExternalEventChangeRequestStatusEnum'
          readOnly: true
        provider:
          allOf:
          - $ref: '#/components/schemas/ProviderEnum'
          readOnly: true
        proposed_values:
          readOnly: true
          description: 'Proposed field values: title, description, start_time, end_time.'
        retained_values:
          readOnly: true
          description: Snapshot of local field values before the change, used to undo
            on rejection.
        resolved_by_user_id:
          type: integer
          nullable: true
          description: Return the resolver's user id, or ``None`` when unresolved.
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created:
          type: string
          format: date-time
          readOnly: true
      required:
      - created
      - event_id
      - id
      - kind
      - proposed_values
      - provider
      - resolved_at
      - resolved_by_user_id
      - retained_values
      - status
    ExternalEventChangeRequestKindEnum:
      enum:
      - update
      - delete
      type: string
      description: |-
        * `update` - Update
        * `delete` - Delete
    ExternalEventChangeRequestStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      - stale
      - auto_undone
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
        * `stale` - Stale
        * `auto_undone` - Auto-undone
    ExternalEventUpdatePolicyEnum:
      enum:
      - allow
      - change_request
      - forbidden
      type: string
      description: |-
        * `allow` - Allow direct updates
        * `change_request` - Updates create change requests
        * `forbidden` - Updates are forbidden
    FrequencyEnum:
      enum:
      - DAILY
      - WEEKLY
      - MONTHLY
      - YEARLY
      type: string
      description: |-
        * `DAILY` - Daily
        * `WEEKLY` - Weekly
        * `MONTHLY` - Monthly
        * `YEARLY` - Yearly
    GroupsEnum:
      enum:
      - organization_admin
      - organization_billing_owner
      - organization_member
      type: string
      description: |-
        * `organization_admin` - organization_admin
        * `organization_billing_owner` - organization_billing_owner
        * `organization_member` - organization_member
    LedgerEvent:
      type: object
      description: |-
        Whatever the project's occurrence source says a metered occurrence was.

        ``MeteredOccurrence.event_id`` is a soft reference (a ``BigIntegerField``,
        not a foreign key) precisely so the billing record outlives the thing it
        billed for -- a customer disputing an invoice must still be able to see what
        they were charged for after the underlying object is deleted.

        The shape beyond ``id`` is the project's, not this package's: it comes
        straight from :meth:`vinta_billing.metering.OccurrenceSource.describe`. Declared
        as a free-form mapping rather than a fixed set of fields so a project can
        return an appointment's title, an API route, or a video's duration without
        this serializer having an opinion.
      properties:
        id:
          type: integer
          description: The occurrence's external id.
      required:
      - id
    MercadoPagoPublicCredentials:
      type: object
      description: The browser-safe half of MercadoPago's credentials -- never the
        secret access token.
      properties:
        public_key:
          type: string
      required:
      - public_key
    MeteredOccurrence:
      type: object
      description: |-
        One row of ``GET /billing/usage/occurrences/`` -- the post-paid ledger
        behind an overage charge, so a customer disputing an invoice can tie every
        unit of money to a specific occurrence.

        ``event``/``organization`` are not model relations on ``MeteredOccurrence``
        (``event_id`` is a soft reference; ``organization`` has no name of its own
        here) -- both are built in ``to_representation`` from maps the view
        resolves once per page and threads through ``context`` (``event_map``,
        ``organization_names``), never a per-row query.
      properties:
        id:
          type: integer
          readOnly: true
        organization:
          allOf:
          - $ref: '#/components/schemas/MeteredOccurrenceOrganization'
          description: The organization this occurrence is attributed to.
        event:
          allOf:
          - $ref: '#/components/schemas/LedgerEvent'
          nullable: true
          description: null when the referenced event no longer exists -- an expected
            state (a MeteredOccurrence outlives its event by design, see the model
            docstring), not an error. The charge still stands; unit_price is unaffected
            either way.
        occurrence_start:
          type: string
          format: date-time
          readOnly: true
        billing_period_start:
          type: string
          format: date-time
          readOnly: true
        is_within_allowance:
          type: boolean
          readOnly: true
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,4})?$
          readOnly: true
      required:
      - billing_period_start
      - event
      - id
      - is_within_allowance
      - occurrence_start
      - organization
      - unit_price
    MeteredOccurrenceOrganization:
      type: object
      description: |-
        The organization a ledger row is attributed to -- ``GET
        /billing/usage/occurrences/``'s ``organization`` field. Names are batch
        resolved by the view (``MeteredOccurrenceViewSet``) once per page, the
        same pattern ``UsageByOrganizationSerializer`` uses.
      properties:
        id:
          type: integer
          description: pk of the attributed organization.
        name:
          type: string
          description: The attributed organization's name.
      required:
      - id
      - name
    MyMembership:
      type: object
      description: |-
        Read-only serializer for the caller's active organization memberships.

        Used by ``GET /organizations/mine/`` to power the frontend org switcher.
        Returns a list of
        ``{organization: {id, name}, permissions, can_manage_branding}``
        entries — one per active membership — without requiring the
        ``X-Organization-Id`` header.
      properties:
        organization:
          allOf:
          - $ref: '#/components/schemas/OrganizationBrief'
          readOnly: true
        permissions:
          type: array
          items:
            type: string
          description: 'Capabilities this membership confers in this organization,
            as ``app_label.codename`` strings (for example ``organizations.manage_members``).
            Resolved from the membership''s groups and direct grants -- the same source
            every server-side authorization check reads -- so a client can gate UI
            on the exact string the API will enforce. Only organization-scoped capabilities
            appear: a global Django permission or superuser status grants nothing
            here, because it grants nothing in this organization either. An inactive
            membership resolves an empty list. The set of possible values grows over
            time; treat an unrecognised entry as an unknown capability rather than
            an error.'
          readOnly: true
        can_manage_branding:
          type: boolean
          description: |-
            Whether this membership can manage branding: its
            ``organizations.manage_branding`` capability plus the parentless,
            entitled organization gate -- see
            ``CurrentMembershipSerializer.get_can_manage_branding`` for the full
            rationale. Computed per membership, so a permitted member and an
            unpermitted member in the same eligible organization receive different
            values.

            Reads from the batch ``_MyMembershipListSerializer`` precomputes on the
            shared context when serializing a list (the ``many=True`` path this
            serializer is actually used on). Falls back to the single-organization
            ``is_branding_eligible_organization`` call when there is no such batch
            in context (e.g. this serializer instantiated directly against one
            membership), which is exactly what the batch entry would have computed
            for that one organization anyway.
          readOnly: true
      required:
      - can_manage_branding
      - organization
      - permissions
    Notification:
      type: object
      description: |-
        Read-only serializer for in-app notification objects.

        Works for both vintasend Notification dataclasses (returned by
        get_in_app_unread) and vintasend_django model instances (ORM rows).

        Fields:
        - id, title, notification_type, status: present on both dataclass and model.
        - body: rendered at read time via body_template + best-available context.
        - created, modified: model-only; None for dataclass instances.
      properties:
        id:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
        notification_type:
          type: string
          readOnly: true
        status:
          type: string
          readOnly: true
        body:
          type: string
          description: |-
            Render the body template with the best-available context.

            Priority:
            1. context_used — the context that was recorded at send time (on model rows,
               set by the backend when the notification was processed).
            2. context_kwargs — the original kwargs passed at creation time.
            3. Empty dict — render the template with no context (graceful degradation).

            Returns an empty string on rendering failure so the response always serialises.
          readOnly: true
        created:
          type: string
          nullable: true
          description: |-
            Return the creation timestamp as ISO 8601 string, or None for dataclasses.

            The vintasend Notification dataclass has no `created` attribute; only the
            vintasend_django ORM model does.
          readOnly: true
        modified:
          type: string
          nullable: true
          description: |-
            Return the last-modified timestamp as ISO 8601 string, or None for dataclasses.

            In vintasend 1.2.0 the Notification dataclass carries `modified`; ORM rows also
            have it. Returns None when the attribute is absent or None.
          readOnly: true
      required:
      - body
      - created
      - id
      - modified
      - notification_type
      - status
      - title
    Organization:
      type: object
      description: |-
        Serializer for Organization instances.

        The ``google_service_account`` field supports both reading and writing:
        - **Write**: accepts ``email``, ``admin_email``,
          ``private_key_id`` (write-only), and ``private_key`` (write-only).
          Omitting the field on PATCH leaves existing credentials unchanged.
        - **Read**: returns ``email``, ``admin_email``, and ``configured: true/false``.
          Secret fields are never returned.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          description: 'Public, URL-safe identifier used by the organization''s branded
            login page and by brandingForTenant. Always set: an organization saved
            without one is given an opaque ``org-<token>`` slug, and the database
            refuses a blank value. Mutable, but not clearable -- changing it orphans
            previously-issued branded login URLs, which then fall back to the default
            identity rather than erroring. Format, reserved-word, and confusable-character
            rules live in organizations.slug_validation and are enforced by each write
            surface (REST serializer, admin form, GraphQL input), not on the model.'
          maxLength: 63
        should_sync_rooms:
          type: boolean
          description: Whether to sync rooms for this organization.
        external_event_update_policy:
          allOf:
          - $ref: '#/components/schemas/ExternalEventUpdatePolicyEnum'
          description: |-
            Policy for handling inbound external provider edits and deletions to synced events. ALLOW: apply directly. CHANGE_REQUEST: route to approval. FORBIDDEN: auto-undo.

            * `allow` - Allow direct updates
            * `change_request` - Updates create change requests
            * `forbidden` - Updates are forbidden
        week_start:
          allOf:
          - $ref: '#/components/schemas/OrganizationWeekStartEnum'
          description: |-
            Day of the week that starts the week for quota period boundaries. Used for calculating quota periods in group-scoped availability rules.

            * `monday` - Monday
            * `sunday` - Sunday
        google_service_account:
          type: object
          additionalProperties: {}
          nullable: true
          description: Return read-only service account info (no secrets), or None
            if unconfigured.
          readOnly: true
        can_invite_organizations:
          type: boolean
          readOnly: true
          description: Whether this organization can invite/create other organizations.
            DB/Django-admin only — never exposed via any API. Enables the whole reseller
            capability bundle.
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
      required:
      - can_invite_organizations
      - created
      - google_service_account
      - id
      - modified
      - name
    OrganizationBranding:
      type: object
      description: |-
        Serializer for OrganizationBranding (reseller-admin REST endpoints).

        Exposes app_name, logo_url, primary_color, secondary_color, support_email,
        and redirect_url. NEVER exposes can_invite_organizations or makes
        organization writable (the org is set from the acting org in the view).

        Validates:
        - Color format: #RRGGBB or #RRGGBBAA (regex).
        - redirect_url: HTTPS scheme, no wildcard character, no path-prefix pattern
          (organizations.redirect_url_validation).

        ``logo_url`` round-trips through ``BrandingLogoField``: reads return a
        time-limited signed URL for the stored object (``None`` when no logo is
        set), writes accept the uploaded S3 key from the ``branding_logos``
        S3Direct destination.
      properties:
        app_name:
          type: string
          description: The display name of the white-labeled app (e.g., 'MyScheduler').
          maxLength: 120
        logo_url:
          type: string
          nullable: true
        primary_color:
          type: string
          description: 'Primary color as hex code: #RRGGBB or #RRGGBBAA.'
          maxLength: 9
        secondary_color:
          type: string
          description: 'Secondary color as hex code: #RRGGBB or #RRGGBBAA.'
          maxLength: 9
        support_email:
          type: string
          format: email
          description: Email address for the From/reply-to on branded transactional
            emails.
          maxLength: 254
        redirect_url:
          type: string
          format: uri
          description: 'Single post-authentication redirect destination for this organization.
            Replaces the old return_url_allowlist: no caller-supplied redirect target
            is ever honored, so there is nothing to validate at request time and no
            open-redirect surface. Must be HTTPS with no wildcard character and no
            path-prefix pattern (organizations.redirect_url_validation).'
          maxLength: 200
      required:
      - app_name
    OrganizationBrandingLogoUploadParams:
      type: object
      description: |-
        Response body for ``OrganizationBrandingLogoUploadParamsView`` — the same
        shape ``organizations.branding_logo.sign_branding_logo_upload`` and the
        GraphQL ``create_branding_logo_upload`` mutation return.

        ``upload_url`` is a complete SigV4 presigned PUT URL. The client uploads by
        PUTting the file body straight to it with a matching Content-Type and no
        other headers — no AWS credentials reach the browser and nothing has to be
        signed client-side. Mirrors ``users.serializers.ProfilePictureUploadParamsSerializer``.
      properties:
        object_key:
          type: string
        upload_url:
          type: string
          format: uri
        expires_in:
          type: integer
      required:
      - expires_in
      - object_key
      - upload_url
    OrganizationBrandingLogoUploadParamsRequest:
      type: object
      description: |-
        Request body for ``OrganizationBrandingLogoUploadParamsView``. Mirrors
        ``users.serializers.ProfilePictureUploadParamsRequestSerializer``.
      properties:
        file_name:
          type: string
        file_type:
          type: string
        file_size:
          type: integer
          minimum: 1
      required:
      - file_name
      - file_size
      - file_type
    OrganizationBrief:
      type: object
      description: |-
        Lightweight read-only serializer for an Organization.

        Exposes only the fields needed for the org-switcher list: ``id``, ``name``,
        and the read-only ``slug`` (so the frontend can render/link the branded login
        URL without a second request). Intentionally avoids the heavier
        ``OrganizationSerializer`` (which loads the Google service account) to keep
        ``GET /organizations/mine/`` fast.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          description: 'Public, URL-safe identifier used by the organization''s branded
            login page and by brandingForTenant. Always set: an organization saved
            without one is given an opaque ``org-<token>`` slug, and the database
            refuses a blank value. Mutable, but not clearable -- changing it orphans
            previously-issued branded login URLs, which then fall back to the default
            identity rather than erroring. Format, reserved-word, and confusable-character
            rules live in organizations.slug_validation and are enforced by each write
            surface (REST serializer, admin form, GraphQL input), not on the model.'
      required:
      - id
      - name
      - slug
    OrganizationInvitation:
      type: object
      description: Serializer for managing OrganizationInvitation instances.
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        organization:
          type: integer
          readOnly: true
        invited_by:
          type: integer
          readOnly: true
          nullable: true
        accepted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
      required:
      - accepted_at
      - created
      - email
      - expires_at
      - id
      - invited_by
      - modified
      - organization
    OrganizationMembership:
      type: object
      description: |-
        Read-only serializer for listing and retrieving organization members.

        Exposes each member's resolved capabilities, active status, and flattened
        user information (email, first_name, last_name) for the admin datatable.
      properties:
        user_id:
          type: integer
          readOnly: true
        organization_id:
          type: integer
          readOnly: true
        permissions:
          type: array
          items:
            type: string
          description: 'Capabilities this membership confers in this organization,
            as ``app_label.codename`` strings (for example ``organizations.manage_members``).
            Resolved from the membership''s groups and direct grants -- the same source
            every server-side authorization check reads -- so a client can gate UI
            on the exact string the API will enforce. Only organization-scoped capabilities
            appear: a global Django permission or superuser status grants nothing
            here, because it grants nothing in this organization either. An inactive
            membership resolves an empty list. The set of possible values grows over
            time; treat an unrecognised entry as an unknown capability rather than
            an error.'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          description: 'Whether this membership is active. Inactive memberships are
            treated as gated: the user still has a row but loses all tenant-scoped
            access until reactivated. Use this to disable a user without deleting
            their membership record (which would lose their groups and history). Default
            True keeps every existing read unchanged.'
        user_email:
          type: string
          format: email
          readOnly: true
        user_first_name:
          type: string
          readOnly: true
        user_last_name:
          type: string
          readOnly: true
      required:
      - is_active
      - organization_id
      - permissions
      - user_email
      - user_first_name
      - user_id
      - user_last_name
    OrganizationWeekStartEnum:
      enum:
      - monday
      - sunday
      type: string
      description: |-
        * `monday` - Monday
        * `sunday` - Sunday
    OwnershipMembership:
      type: object
      description: |-
        Membership identity for a calendar owner.

        A membership has no scalar id (it is identified by the ``(user_id,
        organization_id)`` pair), so the representation exposes that pair.

        It used to carry the membership's ``role`` as well. That left with the rest
        of ``role``'s API surface: authorization is answered from permissions, and
        this identity representation is not the place to publish a member's
        capabilities -- ``GET /organization-members/`` is. Consumers that read
        ``role`` here to decide what to render should read ``permissions`` there.
      properties:
        user_id:
          type: integer
          readOnly: true
        organization_id:
          type: integer
          readOnly: true
      required:
      - organization_id
      - user_id
