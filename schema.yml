  /public-api-tokens/:
    get:
      operationId: public_api_tokens_list
      description: |-
        Admin-only viewset for managing public-API tokens (SystemUser + ResourceAccess rows).

        Supports create, list, retrieve, revoke, and editing resource grants.

        ``POST /public-api-tokens/`` creates a new ``SystemUser`` for the caller's
        organisation, persists the requested ``ResourceAccess`` rows, and returns the
        plaintext token **once**.  The token is never recoverable after this response.

        ``GET /public-api-tokens/`` lists the caller's org tokens without secrets.
        ``GET /public-api-tokens/{id}/`` retrieves a single token without secrets.

        Every route here selects its organization with ``X-Organization-Id``, on the
        terms the header is documented with everywhere else: optional for a caller
        with one active membership, required (400) for a caller with two or more, and
        403 when it names an organization the caller is not an active member of.
      parameters:
      - in: header
        name: X-Organization-Id
        schema:
          type: string
        description: Selects the active organization for this request. Optional for
          callers that belong to exactly one active organization — the single membership
          is resolved implicitly. **Required** when the caller has two or more active
          memberships; omitting it in that case returns **400**. If the header names
          an organization the caller is not an active member of, the server returns
          **403**.
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - public-api-tokens
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSystemUserTokenList'
          description: ''
    post:
      operationId: public_api_tokens_create
      description: |-
        Create a SystemUser and ResourceAccess rows; return the plaintext token once.

        Returns HTTP 201 on success.  The response body includes ``id``,
        ``integration_name``, ``is_active``, ``available_resources``, and a
        write-once ``token`` field — never ``long_lived_token_hash``.

        HTTP 400 is returned for:
        - Invalid or unknown ``available_resources`` values.
        - Empty ``available_resources`` list.
        - Duplicate ``integration_name`` (unique constraint).

        HTTP 403 is returned for non-admin callers; HTTP 401 for unauthenticated.
      parameters:
      - in: header
        name: X-Organization-Id
        schema:
          type: string
        description: Selects the active organization for this request. Optional for
          callers that belong to exactly one active organization — the single membership
          is resolved implicitly. **Required** when the caller has two or more active
          memberships; omitting it in that case returns **400**. If the header names
          an organization the caller is not an active member of, the server returns
          **403**.
      tags:
      - public-api-tokens
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemUserTokenCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SystemUserTokenCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SystemUserTokenCreate'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemUserTokenResponse'
          description: ''
