          description: The new instrument was attached and the outstanding balance
            was submitted for collection at the provider. Recovery is webhook-driven
            -- the subscription in this response is still `"grace"`/`"restricted"`;
            it moves to `"active"` only once the subscription-payment webhook confirms
            the charge.
        '400':
          description: '`payment_token` or `idempotency_key` is missing.'
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingErrorBody'
          description: 'The new instrument was attached, but the provider declined
            the charge against it, or refused to attempt it at all (`code: "charge_declined"`,
            `ChargeDeclinedError`). Distinct from the over-limit 402 rendered elsewhere
            in this API (`OverLimitError`, `code: "limit_exceeded"`) -- both use 402
            Payment Required, `code` disambiguates. The subscription stays GRACE/RESTRICTED.
            A subscription can carry more than one outstanding invoice; if an earlier
            one was paid before a later one hit this decline, a partial collection
            may already have occurred -- submit a different `payment_token` to retry
            the remainder, do not assume nothing moved.'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingErrorBody'
          description: 'One of four conflicts: the subscription is not currently GRACE/RESTRICTED
            (`code: "retry_payment_not_applicable"`, `RetryPaymentNotApplicableError`);
            it has never attached a payment instrument at the provider (`code: "subscription_not_attached"`,
            `SubscriptionNotAttachedError` -- such an organization has never paid
            and belongs on `change-plan`''s first-upgrade path instead); the provider
            reports nothing actually owed for this subscription right now (`code:
            "no_outstanding_balance"`, `NoOutstandingBalanceError`); or the resolved
            provider has no verified balance-collection primitive to drive (`code:
            "collection_not_supported"`, `CollectionNotSupportedError` -- MercadoPago,
            as of this writing).'
  /billing/usage/occurrences/:
    get:
      operationId: billing_usage_occurrences_list
      description: |-
        ``GET /billing/usage/occurrences/`` -- the line-item ledger behind
        post-paid charges: every ``MeteredOccurrence`` row in the caller's pooled
        billing subtree, paginated and filterable by period, allowance side,
        organization, and occurrence-start range, so a customer disputing an
        invoice can tie every unit of money to a specific occurrence.

        **Stricter than every other read in this module.** ``BillingUsageViewSet``
        and ``BillingPeriodViewSet`` stay open to any authenticated member
        (``IsAuthenticated`` alone); this one additionally requires
        ``IsBillingManager``. A ledger row carries an ``event_id`` and an exact
        ``occurrence_start`` -- that is calendar content, and it spans every
        calendar in the caller's pooled subtree, including ones the caller has no
        membership scope on. A count is not.

        ``check_object_permissions`` is called explicitly in ``list()`` against the
        resolved billing root -- the same two-step dance
        ``SubscriptionViewSet.get_subscription`` and ``AddOnViewSet.create`` already
        perform, and for the same reason their comments document:
        ``has_permission`` cannot know *which* organization this read is for,
        because ``request.organization`` is not resolved yet at that point in
        ``TenantScopedViewMixin.initial()``'s ordering (see
        ``IsBillingManager``'s docstring).
      summary: List metered occurrences behind post-paid charges
      parameters:
      - in: header
        name: X-Organization-Id
        schema:
          type: string
        description: Selects the active organization for this request. Optional for
          callers that belong to exactly one active organization — the single membership
          is resolved implicitly. **Required** when the caller has two or more active
          memberships; omitting it in that case returns **400**. If the header names
          an organization the caller is not an active member of, the server returns
          **403**.
      - in: query
        name: billing_period_start
        schema:
          type: string
          format: date-time
        description: Only rows billed to this exact period. Defaults to the current,
          open billing period when omitted.
      - in: query
        name: is_within_allowance
        schema:
          type: boolean
        description: Filter by whether the occurrence fell inside the included allowance
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: occurrence_start_after
        schema:
          type: string
          format: date-time
        description: Only occurrences starting on or after this instant (inclusive).
      - in: query
        name: occurrence_start_before
        schema:
          type: string
          format: date-time
        description: Only occurrences starting on or before this instant (inclusive).
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: ordering
        schema:
          type: array
          items:
            type: string
            enum:
            - -occurrence_start
            - occurrence_start
        description: |-
          Order by occurrence_start. Prefix with '-' for descending. Defaults to -occurrence_start (newest first).

          * `occurrence_start` - Occurrence start
          * `-occurrence_start` - Occurrence start (descending)
        explode: false
        style: form
      - in: query
        name: organization
        schema:
          type: integer
        description: Only rows attributed to this organization. Must be inside the
          caller's pooled billing subtree -- an id outside it is a validation error,
          not an empty result.
      tags:
      - billing
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMeteredOccurrenceList'
          description: ''
