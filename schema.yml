            schema:
              $ref: '#/components/schemas/PatchedAppointmentTypeScopedAvailabilityWindowUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentTypeScopedAvailabilityWindowUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentTypeScopedAvailabilityWindowUpdate'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentTypeScopedAvailabilityWriteResult'
          description: ''
    delete:
      operationId: appointment_types_slots_availability_windows_destroy
      description: Deletes the window (a recurring window is one row -- deletes the
        whole series).
      summary: Delete an appointment-type-scoped availability window
      parameters:
