          default: false
          description: True if cancelling the occurrence, False if modifying
      required:
      - exception_date
    EventTypeEnum:
      enum:
      - calendar_event_created
      - calendar_event_updated
      - calendar_event_deleted
      - calendar_event_attendee_added
      - calendar_event_attendee_removed
      - calendar_event_attendee_updated
      - organization_member_created
      type: string
      description: |-
        * `calendar_event_created` - Calendar Event Created
        * `calendar_event_updated` - Calendar Event Updated
        * `calendar_event_deleted` - Calendar Event Deleted
        * `calendar_event_attendee_added` - Calendar Event Attendee Added
        * `calendar_event_attendee_removed` - Calendar Event Attendee Removed
        * `calendar_event_attendee_updated` - Calendar Event Attendee Updated
        * `organization_member_created` - Organization member created
    ExternalAttendee:
      type: object
      properties:
        id:
          type: integer
          nullable: true
          description: ID of the external attendee.
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 254
        external_client_identifiers:
          type: array
          items:
            $ref: '#/components/schemas/ExternalClientIdentifier'
          description: Client-owned (system, identifier) pairs for this external attendee.
            Omitted leaves the stored set untouched (a no-op on create, since there
            is nothing to leave untouched yet); an explicit list (including []) replaces
            it.
