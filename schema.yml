    BookingCodeAppointmentTypeEventCreate:
      type: object
      description: |-
        Input for ``POST /public/booking/appointment-types/<public_slug>/events/``.

        Mirrors ``CreateAppointmentTypeEventWithCodeInput`` (GraphQL) minus its ``code`` field --
        the booking code travels as the ``X-Booking-Code`` header instead (see
        ``calendar_integration.booking_auth``). The appointment type is never accepted here: on
        the coded branch it comes strictly from the resolved token's
        ``appointment_type``, never from client input or the path (Phase 3b: the path
        carries only ``AppointmentType.public_booking_slug``, an opaque identifier, and
        even that is only a routing convenience -- see
        ``BookingCodeAppointmentTypeEventViewSet.create``). Reuses
        ``_AppointmentTypeSlotSelectionInputSerializer``, the same slot-selection shape
        ``AppointmentTypeEventCreateSerializer`` already uses for the authenticated
        appointment-type-booking endpoint.
      properties:
        title:
          type: string
        description:
          type: string
          default: ''
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        timezone:
          type: string
        slot_selections:
          type: array
          items:
            $ref: '#/components/schemas/_AppointmentTypeSlotSelectionInput'
        external_attendee:
          $ref: '#/components/schemas/_BookingCodeExternalAttendee'
      required:
      - end_time
      - external_attendee
      - slot_selections
      - start_time
      - timezone
      - title
    BookingCodeCreate:
      type: object
      description: |-
        Input for ``POST /booking-codes/`` -- the authenticated minting endpoint.

        Collapses GraphQL's six ``create*BookingCode`` mutations into one resource:
        ``purpose`` x {``calendar``, ``appointment_type``} is the same cross product those
        six mutations cover, no more and no less. ``purpose`` maps onto the permission(s)
        the minted token carries:

        - ``book`` -> ``[EventManagementPermissions.CREATE]``
        - ``reschedule`` -> ``[EventManagementPermissions.RESCHEDULE]``
        - ``cancel`` -> ``[EventManagementPermissions.CANCEL]``

        ``calendar`` / ``appointment_type`` / ``event`` are plain integer ids, not
        ``PrimaryKeyRelatedField`` -- object existence and org/authorization checks
        happen in ``BookingCodeViewSet.create`` so a cross-organization target can be
        answered ``404`` there rather than a serializer-level ``400``, keeping "target
        exists but you can't see it" indistinguishable from "target does not exist".

        No ``duration_seconds`` field: duration pinning lives on
        ``AppointmentType.duration``, not on the minted token -- there is no
        per-code duration to set at mint time. A calendar-scoped code carries no
        duration constraint at all; an appointment-type-scoped code inherits
        whatever duration (if any) is already set on that appointment type.
      properties:
        purpose:
          $ref: '#/components/schemas/PurposeEnum'
        calendar:
          type: integer
          nullable: true
        appointment_type:
          type: integer
          nullable: true
        event:
          type: integer
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
      required:
      - purpose
    BookingCodeCreateResult:
      type: object
      description: |-
        One-time response for ``POST /booking-codes/``.

        ``code`` carries the plaintext booking code -- it is generated fresh by
        ``CalendarPermissionService.create_booking_token`` and never persisted or
        re-derivable, so this is the only response that will ever expose it. Every
        field here is read-only: this serializer only ever renders a response, it
        is never used to validate input.
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          readOnly: true
        purpose:
          $ref: '#/components/schemas/PurposeEnum'
        calendar:
          type: integer
          readOnly: true
          nullable: true
        appointment_type:
          type: integer
          readOnly: true
          nullable: true
        event:
          type: integer
          readOnly: true
          nullable: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - appointment_type
      - calendar
      - code
      - event
      - expires_at
      - id
      - purpose
    BookingCodeEventCreate:
      type: object
      description: |-
        Input for ``POST /public/booking/calendar-events/``.

        Mirrors ``CreateEventWithCodeInput`` (GraphQL) minus its ``code`` field -- the
        booking code travels as the ``X-Booking-Code`` header instead (see
        ``calendar_integration.booking_auth``). ``calendar_id`` is never accepted here:
        it comes strictly from the resolved token, never from client input.
      properties:
        title:
          type: string
        description:
          type: string
          default: ''
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        timezone:
          type: string
        external_attendee:
          $ref: '#/components/schemas/_BookingCodeExternalAttendee'
      required:
      - end_time
      - external_attendee
      - start_time
      - timezone
      - title
    BookingCodeReschedule:
      type: object
      description: |-
        Input for ``POST /public/booking/events/reschedule/`` and
        ``POST /public/booking/appointment-type-events/reschedule/``.

        Mirrors ``RescheduleWithCodeInput`` / ``RescheduleAppointmentTypeWithCodeInput`` (GraphQL)
        minus their ``code`` field -- the booking code travels as the ``X-Booking-Code``
        header instead. Only the new start/end/timezone are accepted: title, description,
        attendees, and resource allocations are never client-settable here -- the view
        snapshots them, unchanged, from the existing event so that only the RESCHEDULE
        permission is required (see ``BookingCodeRescheduleEventViewSet.create``).
      properties:
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        timezone:
          type: string
      required:
      - end_time
      - start_time
      - timezone
    BookingManagementCodes:
      type: object
      description: |-
        The ``management`` object on a booking-code create/reschedule ``201``.

        ``reschedule_code`` and ``cancel_code`` are plaintext, single-use booking
        codes minted for the patient's own event (see
        ``booking_views.mint_management_code_pair``), returned exactly once here
        -- only their hashes are persisted, so this is the only response that
        will ever expose them. Never echoed on a read: none of the booking-code
        viewsets has one.

        Fields are read-only for documentation purposes only (this serializer
        never validates input, it only renders a nested attribute the view sets
        on the event instance before serialization -- see
        ``CalendarEventWithManagementCodesSerializer``).
      properties:
        reschedule_code:
          type: string
          readOnly: true
        cancel_code:
          type: string
          readOnly: true
      required:
      - cancel_code
      - reschedule_code
    BookingPolicy:
      type: object
      description: |-
        Serializer for ``BookingPolicy`` CRUD.

        Exactly one of ``calendar``, ``membership_user_id``, ``appointment_type``, or
        ``is_organization_default`` must be set on create.  Targets are immutable
        after creation — only the four rule-field seconds are writable on update.

        Validation:
        - ``validate()`` enforces the exactly-one-target invariant on create.
        - ``validate_membership_user_id()`` checks that the supplied user id belongs
          to the caller's organization (on create only; targets are immutable on update).
        - ``DuplicateBookingPolicyError`` from the service is caught and surfaced as
          a 400 validation error so the client gets a named conflict message.
        - The four rule fields use ``min_value=0`` so DRF rejects negatives with a
          clear field-level 400 before the value reaches the model's
          ``PositiveIntegerField`` constraint.

        Write paths (create / update) delegate to ``BookingPolicyService`` stored on
        the serializer context as ``"booking_policy_service"`` (the viewset sets it).
      properties:
        id:
          type: integer
          readOnly: true
        calendar:
          type: integer
          nullable: true
        appointment_type:
          type: integer
          nullable: true
        membership_user_id:
          type: integer
          nullable: true
        is_organization_default:
          type: boolean
          default: false
        lead_time_seconds:
          type: integer
          minimum: 0
          default: 0
        max_horizon_seconds:
          type: integer
          minimum: 0
          default: 0
        buffer_before_seconds:
          type: integer
          minimum: 0
          default: 0
        buffer_after_seconds:
          type: integer
          minimum: 0
          default: 0
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
      required:
      - created
      - id
      - modified
    BulkBlockedTime:
      type: object
      description: Serializer for creating multiple blocked times.
      properties:
        blocked_times:
          type: array
          items:
            $ref: '#/components/schemas/BlockedTime'
