# yaml-language-server: $schema=./node_modules/vinta-ai-workflows/schemas/vinta-ai-workflows-config.v1.schema.json

schema_version: 1
vinta_ai_workflows_version: "0.7.0-alpha27"
last_synced_at: "2026-10-09T17:04:24Z"

project:
  name: vinta_schedule_api
  default_branch: main
  code_host: github
  stack_summary: "Django 6 + DRF + Strawberry GraphQL + Celery, multi-tenant (SingleOrganizationModelMixin), Postgres, deployed to AWS ECS/Fargate"
  ai_plans_dir: ai-plans
  pr_template_paths: []

# Container surface (`docker compose run --rm api ...`) — the one AGENTS.md points daily
# app work at. The host surface (bare `uv run ...`) is what pre-commit and CI use.
commands:
  lint: "docker compose run --rm api uv run ruff check ./"
  format: "docker compose run --rm api uv run ruff format ./"
  build: "docker compose run --rm api uv run python manage.py check --deploy"
  test_unit: "docker compose run --rm api uv run pytest -n auto"
  test_unit_scoped: "docker compose run --rm api uv run pytest <app>/tests/ -n auto"
  test_unit_new_pattern: "docker compose run --rm api uv run pytest <new-test-path> -vs"
  # Deterministic worktree provisioning (generated from the vinta-ai-workflows
  # templates). implement-plan runs these instead of the prepare-worktree skill,
  # which stays enabled as the fallback when the command fails.
  worktree_prepare: "scripts/worktree/prepare.sh"
  worktree_teardown: "scripts/worktree/teardown.sh"

policies:
  pr_creation: agents-create
  ai_coauthor: forbidden
  commit_style: conventional
  commit_strategy: ask
  stage_pattern: "git add <explicit paths>"
  anti_git_add_all_reason: "repo root holds untracked .env / .env.docker, generated schema.yml / schema-auth.yml, .coverage, mailpit-data — `git add -A` will sweep them in"
  dependency_licenses:
    enforcement: block
    forbidden_spdx:
      - GPL-2.0-only
      - GPL-3.0-only
      - AGPL-3.0-only
      - SSPL-1.0
    allowed_overrides: []
    notes: ""

vendors:
  - claude
  - cursor
  - copilot
  - codex

foundation_skills:
  plan-feature: enabled
  create-spec: enabled
  create-qa-use-cases: disabled
  implement-plan: enabled
  amend-plan: enabled
  open-pr-from-context: enabled
  add-e2e-test: disabled
  add-env-var: enabled
  systematic-debugging: enabled
  add-one-off-script: enabled
  prepare-worktree: enabled
  deslop-comments: enabled
  handoff: enabled
  thermo-nuclear-code-quality-review: enabled
  thermo-nuclear-review-loop: enabled
  interview-ui: enabled
  handoff-to-client: enabled
  write-unit-test: enabled

foundation_agents:
  implementer: enabled
  reviewer: enabled
  fixer: enabled

integrations:
  pr-review-canvas: enabled

# Tiers (1-4) into ai-tools/skills/plan-feature/resources/ai-models.yaml.
# Unset key = that spawn uses the runtime default. There is no `reviewer` key:
# review-phase runs its reviewer one tier above the phase's implementer.
agent_models:
  fixer: 2
  worktree_prep: 1
  integrate: 1

# Project defaults every maestro plan inherits; a plan's .workflow.json only
# states what differs. Gate types fall back to `commands.*` (lint -> lint,
# typecheck -> build, test -> test_unit); typecheck is overridden here so maestro
# also runs mypy, which the outer gate requires. implement-plan keeps running
# `commands.*`.
maestro:
  defaults:
    gates: [lint, typecheck, test]
    chores: [review, deslop, review-canvas]
  # The compose Postgres has a password (`password`) the host cannot supply, so a host
  # `createdb` / `dropdb` would prompt for one. Run them inside the main stack's db container,
  # which trusts local connections; -h/-p/-U from server_url still follow. They run in a lane's
  # environment too (the per-lane clone), where COMPOSE_FILE and the project name point at the
  # lane's own stack, so both are pinned to the main stack here.
  project:
    migrate_cmd: "uv run python manage.py migrate"
    databases:
      test:
        engine: postgres
        delivery: external
        name: vinta_schedule_api
        server_url: "postgres://vinta_schedule_api@localhost:5432"
        connection_url_var: DATABASE_URL
        createdb_cmd: "env -u COMPOSE_FILE docker compose -p vinta-schedule-api exec -T db createdb"
        dropdb_cmd: "env -u COMPOSE_FILE docker compose -p vinta-schedule-api exec -T db dropdb"
    env_files:
      - .env
      - .env.docker
      - vinta_schedule_api/settings/local.py
  gates:
    typecheck:
      cmd: "docker compose run --rm api sh -c 'uv run mypy . && uv run python manage.py check --deploy'"
  chores:
    review:
      skill: thermo-nuclear-review-loop
      when: review
      prompt: "Run the thermo-nuclear-review-loop skill over this phase's diff until its reviewer approves it."
      description: "The phase's code review: one reviewer sub-agent, the implementer fixing and answering it."
    deslop:
      skill: deslop-comments
      prompt: "Rewrite the comments and doc blocks this phase wrote into Simple English, and delete the ones that should not be there. Comment-only: no renames, no logic changes."
      description: "The comment-hygiene pass, on the diff that is about to merge."
    review-canvas:
      skill: pr-review-canvas
      when: after_pr
      prompt: "Generate the review canvas for this phase's pull request: run `/pr-review-canvas` with the PR number named above. Report the local review URL and the PR comment link it returns. Do not change any file in the repository."
      description: "A topic-grouped review canvas on each phase PR, for the human reviewer."

stacks:
  - django

stack_specialist_agents:
  - migration-author

run_options:
  implement-plan:
    pause_between_phases: false
    generate_inline_comments: false
    use_worktree: true
    full_test_suite: false
    parallel_phases: true
    max_parallel_lanes: 3
  amend-plan:
    blast_radius_signal_threshold: 2

skills:
  add-one-off-script:
    scripts_dir: scripts/one_off
    language: python
    log_dir: .vinta-ai-workflows/one-off-runs
    default_batch_size: 500
    csv_max_cells: 1000000
    s3_bucket: ""
    s3_prefix: one-off-runs/
  systematic-debugging:
    observability_mcp_servers: []
  handoff-to-client:
    client_platforms:
      - "Web SPA (React)"
      - "Partner integrations"
    api_style: "REST + GraphQL"
    api_spec_path: "schema.yml (regenerate: make update_schema)"
    output_dir: .vinta-ai-workflows/client-handoffs
  prepare-worktree:
    worktree_root: .claude/worktrees
    deps_strategy: reinstall
    compose_network: per-worktree
    test_db_strategy: fork-on-schema-change
    summary_dir: .vinta-ai-workflows/worktrees
    # Compose volume keys safe to keep SHARED across worktrees. Empty = fork every
    # leaky (external/fixed-name) volume, which is the safe default. Never list a
    # data volume here: dbdata and floci_data must always fork.
    shared_volumes: []
  write-unit-test:
    test_style: classes
    data_setup: factories
    assertion_style: plain-assert
    db_isolation: transaction-rollback
    additional_conventions: []
