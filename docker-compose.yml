x-python-service: &python-service
  build:
    dockerfile: Dockerfile.development
    context: .
  env_file: .env.docker
  volumes:
    - ./:/home/user/app/
    - virtualenv:/opt/venv
  stdin_open: true
  tty: true

services:
  db:
    image: "postgres:alpine"
    environment:
      - POSTGRES_USER=vinta_schedule_api
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=vinta_schedule_api
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/18/docker

  result:
    image: "redis:alpine"
    ports:
    - "6379:6379"

  api:
    <<: *python-service
    ports:
      - "8000:8000"
    depends_on:
      - db
      - result
      - mailpit
      - floci

  # Idle unless CELERY_TASK_ALWAYS_EAGER=false in .env.docker -- tasks otherwise run
  # in-process in the api container and nothing is ever published. Turn it off to
  # exercise the real broker path: this worker then consumes from Floci's SQS, the
  # same transport the deployed environments use.
  worker:
    <<: *python-service
    command: celery --app=vinta_schedule_api worker --loglevel=info
    depends_on:
      - db
      - result
      - floci

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    volumes:
      - ./.mailpit-data:/data
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - default

  # The floci image's app process runs as uid 1001, but a fresh floci_data
  # volume mounts at /data owned by root:root -> floci can't create /data/s3 or
  # persist state, and every S3 op 500s. This one-shot sidecar chowns the volume
  # to 1001 before floci starts.
  floci-init:
    image: busybox
    command: chown -R 1001:1001 /data
    volumes:
      - floci_data:/data

  floci:
    image: floci/floci:latest
    depends_on:
      floci-init:
        condition: service_completed_successfully
    ports:
      - '4566:4566'
    volumes:
      - floci_data:/data
    environment:
      - FLOCI_PORT=4566
      - FLOCI_HOSTNAME=floci
      - FLOCI_STORAGE_MODE=persistent
      - FLOCI_STORAGE_PERSISTENT_PATH=/data
      - FLOCI_DEFAULT_REGION=us-east-1


volumes:
  dbdata:
    name: vinta_schedule_api_dbdata
    external: true
  floci_data:
    name: vinta_schedule_api_floci_data
    external: true
  virtualenv:
    name: vinta_schedule_api_virtualenv
    external: true
